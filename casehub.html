<style>
 :root{--fg:#1b1a19;--mfg:#7c7670;--line:#ece7df;--bg:#FBF8F1;--card:#fff;
   --primary:#9B1B33;--primary-dark:#7A1427;--amber:#C26A00;--kakao:#FEE500;--green:#0f8a5f;--blue:#3551B5;--red:#b3261e}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'Pretendard','Inter','Malgun Gothic',system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
 .hidden{display:none!important}
 .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
 .lcard{width:100%;max-width:400px;background:#fff;border:1px solid #e7e5e4;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:32px}
 .lhead{text-align:center;margin-bottom:22px}.lhead h1{font-size:22px;font-weight:800}.lhead p{font-size:14px;color:var(--mfg);margin-top:6px}
 .field{margin-bottom:15px}.flbl{font-size:14px;font-weight:600;margin-bottom:7px;display:block}
 .input{height:42px;width:100%;border:1px solid #e0ddda;border-radius:9px;padding:0 12px;font-size:14px;outline:none}
 .pwwrap{position:relative}.pwwrap .input{padding-right:56px}
 .pweye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:12.5px;font-weight:700;color:var(--mfg);cursor:pointer;padding:6px 8px}.pweye:hover{color:var(--fg)}
 .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(155,27,51,.13)}
 .lbtn{height:42px;width:100%;border:none;border-radius:9px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}
 .lbtn:hover{background:var(--primary-dark)}.lbtn:disabled{opacity:.6}
 .err{display:none;background:#FCE4E4;border:1px solid #f2c4c4;color:#b3261e;font-size:13px;border-radius:8px;padding:9px 12px;margin-top:13px}
 .top{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #eceae7;position:sticky;top:0;z-index:50}
 .brand{font-weight:800;font-size:16px}.right{display:flex;align-items:center;gap:10px}
 .who{font-size:13px;color:var(--mfg);background:#f3f1ef;border-radius:999px;padding:6px 13px;font-weight:600}
 .logout{font-size:13px;border:1px solid #e0ddda;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}.logout:hover{background:#f5f4f3}
 .wrap{max-width:920px;margin:0 auto;padding:26px 16px 70px}
 .htitle{font-size:42px;font-weight:900;letter-spacing:-.02em;margin:6px 4px 22px}
 .board{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 18px}
 .bd{padding:20px 22px;border-right:1px solid var(--line)} .bd:last-child{border-right:none}
 .bd .l{font-size:13px;color:var(--mfg);font-weight:600}.bd .v{font-size:27px;font-weight:800;margin-top:5px;line-height:1}.bd .v small{font-size:14px;color:var(--mfg);font-weight:700;margin-left:2px}
 .bd.alert{background:#FBEEDD} .bd.alert .v{color:var(--amber)}
 .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
 .tbtn{font-size:13px;font-weight:700;border:1px solid #d6d3d0;background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer}.tbtn:hover{background:#faf9f8}
 .searchbar{margin-bottom:14px}
 .searchin{width:100%;height:46px;border:1px solid #e0ddda;border-radius:12px;padding:0 15px;font-size:15px;outline:none;background:#fff}
 .searchin:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(155,27,51,.12)}
 .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
 .fchip{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid #ddd9d5;background:#fff;cursor:pointer;color:#57534e}
 .fchip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
 .db-kpis{display:flex;border-top:2.5px solid var(--fg);border-bottom:1px solid var(--line);padding:18px 0;margin:0 0 8px}
 .db-kpi{flex:1;text-align:center;border-right:1px solid var(--line)}.db-kpi:last-child{border-right:none}
 .db-kpi .v{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1}
 .db-kpi .l{font-size:14px;color:#4a463f;font-weight:800;margin-top:7px}
 .db-h{font-size:15px;font-weight:900;margin:16px 2px 10px;display:flex;align-items:center;gap:7px}.db-h::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px}
 .db-pipe{display:flex;justify-content:space-between;gap:6px}
 .db-st{flex:1;text-align:center;padding:10px 2px 8px;border-bottom:4px solid var(--line);cursor:pointer;border-radius:0}
 .db-st.hot{border-bottom-color:var(--primary)}.db-st .n{font-size:24px;font-weight:900}.db-st.hot .n{color:var(--primary)}
 .db-st .x{font-size:12.5px;color:#4a463f;font-weight:800;margin-top:4px}
 .db-orow{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}.db-orow:last-child{border-bottom:none}
 .db-dot{width:11px;height:11px;border-radius:50%;flex:none}.db-nm{font-weight:800;font-size:15px;min-width:130px}
 .db-tr{flex:1;height:11px;background:#efeae1;border-radius:999px;overflow:hidden}.db-tr i{display:block;height:100%;border-radius:999px}
 .db-pc{font-weight:900;min-width:96px;text-align:right;font-size:14.5px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 22px 22px 20px;box-shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.05)}
 .odot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
 .ofchip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
 .ctype{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid #d8d4d0;color:#57534e;background:#fff;margin-left:7px;vertical-align:3px}
 .ch{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px}
 .chr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
 .nm{font-size:18px;font-weight:800}.of{font-size:12.5px;color:var(--mfg);margin-top:5px}
 .pill{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:#f1efed;color:#57534e;white-space:nowrap}
 .pill.서류취합중{background:#FBEEDD;color:var(--amber)} .pill.취합완료{background:#E9EDFB;color:var(--blue)}
 .pill.접수완료,.pill.개시결정,.pill.인가결정{background:#DDF3EA;color:var(--green)}
 .pill.기각{background:#F6E7E6;color:var(--red)}
 .pill.소송구조신청{background:#E0F2FE;color:#0369A1} .pill.채권자집회{background:#EDE7F6;color:#4527A0}
 .pill.면책허가결정{background:#DDF3EA;color:#0F766E} .pill.폐지결정{background:#FDF0E3;color:#B45309} .pill.종결{background:#F1EFED;color:#57534E}
 /* 보정 사건 전용 단계 (2026-08-11) */
 .pill.보정중{background:#EDE7F6;color:#4527A0} .pill.기각{background:#F1F2F5;color:#5B6270}
 .bigtabs{display:flex;border-bottom:2px solid var(--line);margin:0 0 14px}
 .bt{padding:11px 20px;font-weight:800;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;user-select:none}
 /* ── 숫자 점검 줄 (2026-08-12) ─────────────────────────────────
    사건 수가 이상할 때 "왜 적게 나오는지"를 화면에서 바로 알 수 있게 한다.
    지금까지는 권한이 master 가 아니면 조용히 '공개된 사건'만 보여 줘서,
    같은 DB인데도 탭마다 숫자가 달라 보이는 일이 있었다. */
 .lstat{font-size:12.5px;font-weight:700;color:#a8a29a;margin:-6px 0 12px;padding:0 2px;line-height:1.6}
 .lstat b{color:#57534e}
 .lstat.warn{color:#8a6500;background:#FFF8E1;border:1px solid #F0E2A8;border-radius:9px;padding:8px 11px;margin-top:0}
 .lstat.warn b{color:#7a5a00}
 .lstat.err{color:#8a2f24;background:#FDECEA;border:1px solid #F3C9C4;border-radius:9px;padding:8px 11px;margin-top:0}
 /* ── 구역별 전체 선택 줄 (2026-08-12) ── */

 /* 2026-08-11 '기각' 추가 — 취합앱에도 같은 단계를 만들었고, clients.stage 검사 규칙(clients_stage_check)이
    이미 '기각'을 허용하고 있어 SQL 없이 그대로 쓸 수 있다. */
 const STAGES=["서류취합중","취합완료","접수완료","소송구조신청","개시결정","채권자집회","인가결정","면책허가결정","폐지결정","기각","종결"];   /* 2026-08-31: 8/30 시트 이관 때 새로 생긴 5단계를 여기서도 알게 한다 */
 /* 보정만 넘겨받은 사건 전용 단계 (2026-08-11 혜림 확정)
    — 우리가 접수한 사건이 아니므로 서류취합중·취합완료·접수완료를 쓰지 않는다. */
 const BJ_STAGES=["보정중","개시결정","채권자집회","인가결정","면책허가결정","폐지결정","기각","종결"];   /* 2026-08-31 신설 4개 추가 */
 let MODE="all";   /* "all" = 전체 사건 탭 / "bj" = 보정 사건 탭 */
 function curStages(){ return MODE==="bj" ? BJ_STAGES : STAGES; }
 function stagesFor(c){ return isBJ(c) ? BJ_STAGES : STAGES; }
 /* 보정만 넘겨받은 사건인가 (2026-08-11)
    — 서류취합을 우리가 하지 않는 사건이라 취합률·단계별 집계에서 뺀다. 칸이 없는 DB에서는 전부 false. */
 function isBJ(c){ return !!c && c.intake_type==="보정만"; }
 /* ===== 민원업체 진행 표시 (2026-08-13) =====
    취합앱이 clients.app_json 안 minwon = {step, vendor, memo, log} 에 적는다.
    ★여기(케이스허브·원사무실 미리보기)에서는 단계만 보여준다 — 업체 이름과 내부 메모는 내보내지 않는다.

 const MW_STEPS=["의뢰함","진행중","발급완료"];
 function mwStep(c){
   try{
     const aj=(typeof c.app_json==="string")?JSON.parse(c.app_json):(c.app_json||{});
     const s=aj&&aj.minwon&&aj.minwon.step;
     return MW_STEPS.includes(s)?s:"";
   }catch(e){ return ""; }
 }
 function mwBadge(c){
   const s=mwStep(c); if(!s) return "";
   return `<span class="mk mw${s==="발급완료"?" done":""}" title="민원업체(서류 발급 대행) 진행 상황">민원 · ${esc(s)}</span>`;
 }
 const AMEND_STAGES=["접수완료","개시결정"];

 function stageDays(c){ if(!c||!c.stage_at) return null;

   const d=Math.floor((Date.now()-t.getTime())/86400000)+1;   /* 넘어온 당일을 1일째로 센다 */
   return d>0?d:1; }

 /* ★★ 1,000줄 한계 (2026-07-13 취합앱 사고와 동일 원인)
    Supabase(PostgREST)는 목록 조회 한 번에 최대 1,000줄만 주고, 넘는 줄은 오류 없이 버린다.
    checklist_items가 1,000줄을 넘자 부족서류 목록(MISS)이 절반만 읽혀, 서류를 다 받은 것처럼 보였다.
    → 모든 목록 조회는 이 함수로 1,000줄씩 끝까지 이어 받는다. db.from(X).select()를 그냥 쓰지 말 것. */
 async function chSelectPaged(table, cols){
   const PAGE=1000; let out=[];
   for(let pg=0; pg<1000; pg++){
     const r=await db.from(table).select(cols).order("id").range(pg*PAGE, pg*PAGE+PAGE-1);
     if(r.error) return {data:null, error:r.error};
     const rows=r.data||[];
     out=out.concat(rows);
     if(rows.length<PAGE) break;
   }
   return {data:out, error:null};
 }

 // ===== 접수서류 =====
 function ftype(n){const e=((n||"").split(".").pop()||"").toLowerCase();if(e==="pdf")return"pdf";if(["doc","docx","hwp"].includes(e))return"doc";if(["xls","xlsx","csv"].includes(e))return"xls";if(["jpg","jpeg","png","gif","webp","bmp"].includes(e))return"img";return"etc";}
 function canPreview(n){const t=ftype(n);return t==="pdf"||t==="img";}
 function saveBlob(b,n){const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);}
 function curDocs(){const q=(($("#docQ")&&$("#docQ").value)||"").toLowerCase();return DOCS.filter(d=>!q||(d.file_name||"").toLowerCase().includes(q));}
 function updDocSel(){
   const s=$("#docSel"); if(s) s.textContent=DSEL.size+"개 선택";
   const bar=$("#docBulk"); if(bar) bar.classList.toggle("hidden",DSEL.size===0);
   const vis=curDocs(); const all=$("#docAll"); if(all) all.checked=vis.length>0&&vis.every(d=>DSEL.has(d.id));
   /* 구역별 '전체 선택' 칸도 같이 맞춘다 — 파일을 하나씩 체크해도 구역 칸이 따라 켜지고 꺼진다 (2026-08-12) */
   const boxes=document.querySelectorAll(".secall");
   if(boxes.length){
     const q=(($("#docQ")&&$("#docQ").value)||"").toLowerCase();
     const byKey={}; secList().forEach(x=>{ byKey[secKey(x)]=x; });
     boxes.forEach(cb=>{
       const sec=byKey[cb.dataset.key]; if(!sec) return;
       const shown=sec.docs.filter(d=>!q||(d.file_name||"").toLowerCase().includes(q));
       cb.checked=shown.length>0&&shown.every(d=>DSEL.has(d.id));
       const n=cb.parentNode.querySelector(".secseln");
       if(n){ const k=shown.filter(d=>DSEL.has(d.id)).length; n.textContent=(k&&!cb.checked)?k+"개 선택됨":""; }
     });
   }
 }
 function clearDocSel(){ DSEL=new Set(); renderDocs(); }

 /* ===== 서류 구역 ===== (2026-08-11)
    ★ 1,000줄 한계 — 한 의뢰인 파일이 1,000개를 넘어도 끝까지 읽는다. */
 async function chPagedWhere(table,cols,col,val,ord){
   const PAGE=1000; let out=[];
   for(let pg=0; pg<200; pg++){
     const r=await db.from(table).select(cols).eq(col,val).order(ord||"id").range(pg*PAGE,pg*PAGE+PAGE-1);
     if(r.error) return {data:null,error:r.error};
     const rows=r.data||[]; out=out.concat(rows);
     if(rows.length<PAGE) break;
   }
   return {data:out,error:null};
 }
 async function chDocsOf(cid){
   let r=await chPagedWhere("documents","id,file_name,storage_path,is_public,created_at,kind,section_id,uploaded_by,updated_at,updated_by","client_id",cid,"created_at");
   if(r.error){ DOC_HAS_UPD=false;   // 수정시각 칸(D01 SQL)이 아직 없을 때
     r=await chPagedWhere("documents","id,file_name,storage_path,is_public,created_at,kind,section_id,uploaded_by","client_id",cid,"created_at"); }
   else DOC_HAS_UPD=true;
   if(r.error) r=await chPagedWhere("documents","id,file_name,storage_path,is_public,created_at,kind","client_id",cid,"created_at"); // section_id 칸도 없을 때
   return r;
 }
 /* 메모: author_office(작성자 사무소) 칸이 아직 없는 DB에서도 화면이 뜨도록 폴백을 둔다.
    칸이 없으면 MEMO_HAS_OFF=false 가 되고 "블루가 쓴 것" 칩만 안 보인다. */
 async function chMemosOf(cid){
   let r=await db.from("memos").select("id,body,author,is_public,created_at,kind,author_office").eq("client_id",cid).eq("kind","접수").order("created_at");
   if(r.error){ MEMO_HAS_OFF=false; r=await db.from("memos").select("id,body,author,is_public,created_at,kind").eq("client_id",cid).eq("kind","접수").order("created_at"); }
   else MEMO_HAS_OFF=true;
   return r;
 }
 async function chSectionsOf(cid){
   const r=await chPagedWhere("doc_sections","id,name,tone,sort_order,collapsed,readonly","client_id",cid,"sort_order");
   if(r.error) return r;
   r.data=(r.data||[]).slice().sort((a,b)=>(a.sort_order-b.sort_order)||String(a.name).localeCompare(String(b.name)));

 }
 /* 화면에 그릴 구역 목록을 만든다.
    - 취합앱이 넣은 파일(kind='취합')은 항상 "취합앱에서 받은 서류" 열람 전용 구역으로 간다.
    - 구역이 없는(section_id 가 빈) 파일은 첫 구역에 얹어 보여준다 → 파일이 화면에서 사라지지 않는다.
    - 구역 표가 아예 없는 DB에서도 '접수 서류' 한 칸으로 그대로 뜬다. */
 function secList(){
   /* ★취합앱 파일은 우리 직원에게만 보인다 — 원사무실에는 아예 그리지 않는다 (2026-08-11 혜림 확정) */
   const ga=canEdit()?DOCS.filter(d=>d.kind==="취합"):[];
   const own=DOCS.filter(d=>d.kind!=="취합");
   let list=(SEC_OK?SECS:[]).map(s=>({id:s.id,name:s.name,tone:s.tone||"기본",collapsed:!!s.collapsed,readonly:!!s.readonly,real:true,docs:[]}));
   const byId={}; list.forEach(s=>{byId[s.id]=s;});
   const orphan=[];
   own.forEach(d=>{ const s=d.section_id?byId[d.section_id]:null; if(s) s.docs.push(d); else orphan.push(d); });
   if(!list.length) list=[{id:null,name:"접수 서류",tone:"기본",collapsed:false,readonly:false,real:false,docs:orphan}];
   else if(orphan.length) list[0].docs=orphan.concat(list[0].docs);

 async function renderPdfPreview(body){
   if(!window.pdfjsLib){body.innerHTML=`<iframe src="${PV.url}"></iframe>`;return;}
   body.innerHTML=`<div class="pvpdf" id="pvpdf"></div>`;
   const cont=$("#pvpdf");
   try{
     const {data,error}=await db.storage.from("docs").download(PV.path);
     if(error||!data) throw new Error("dl");
     const buf=await data.arrayBuffer();
     const pdf=await pdfjsLib.getDocument({data:buf}).promise;
     const targetW=Math.min((cont.clientWidth||800)-24,880);
     for(let i=1;i<=pdf.numPages;i++){
       const page=await pdf.getPage(i);
       const base=page.getViewport({scale:1});
       const vp=page.getViewport({scale:targetW/base.width});
       const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;cv.className="pvpdfpage";
       cont.appendChild(cv);
       await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
     }
   }catch(e){body.innerHTML=`<iframe src="${PV.url}"></iframe>`;}

 /* ===== ZIP 내려받기 (2026-08-12 혜림 요청으로 개편) =====
    예전에는 파일이 압축 안에 그냥 쭉 나열돼서, 받은 뒤에 어느 게 접수 서류이고
    어느 게 몇 회차 보정 서류인지 알 수가 없었다.
    이제 '의뢰인이름_구역이름' 폴더로 나눠 담는다.
      홍길동_접수 서류/개인회생신청서.pdf
      홍길동_보정 서류 1회차/보정서.pdf                                           */
 /* 윈도우·맥이 파일 이름에 못 쓰는 글자를 바꾼다 ( \ / : * ? " < > | ) */
 function zipSafe(s,max){
   let t=String(s==null?"":s).replace(/[\\/:*?"<>|]/g,"_").replace(/[\x00-\x1f]/g,"").replace(/\s+/g," ").trim();
   t=t.replace(/[. ]+$/,"");                       // 윈도우는 이름 끝의 점·공백을 싫어한다
   if(max&&t.length>max) t=t.slice(0,max).trim();
   return t||"이름없음";
 }
 function ymd(){ const d=new Date(); return ""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
 function curName(){ const c=CLIENTS.find(x=>x.id===DCID); return (c&&c.name)||"의뢰인"; }
 async function dlZip(list,zipName){
   if(!list.length){toast("선택된 파일이 없습니다");return;}
   if(!window.JSZip){toast("압축 모듈 로딩 중, 잠시 후 다시");return;}
   toast("압축 준비 중...");
   const cname=zipSafe(curName(),40);
   /* 파일 → 구역 이름 지도를 한 번만 만든다 (파일마다 구역을 찾으면 느리다) */
   const secOf={}; secList().forEach(s=>{ s.docs.forEach(d=>{ secOf[d.id]=s.name; }); });
   const zip=new JSZip(), used={}; let ok=0, fail=0;
   for(const d of list){
     if(!d.storage_path){ fail++; continue; }
     const {data,error}=await db.storage.from("docs").download(d.storage_path);
     if(error||!data){ fail++; continue; }
     const folder=cname+"_"+zipSafe(secOf[d.id]||"기타 서류",50);
     let nm=zipSafe(d.file_name||"파일");
     if(used[folder+"/"+nm]){                       // 같은 폴더 안 이름 겹침만 번호를 붙인다
       const m=nm.match(/^(.*?)(\.[A-Za-z0-9]{1,6})?$/), b=m[1], x=m[2]||"";
       let k=1; while(used[folder+"/"+b+"("+k+")"+x]) k++;
       nm=b+"("+k+")"+x;
     }
     used[folder+"/"+nm]=1;
     zip.folder(folder).file(nm,data); ok++;
   }
   if(ok===0){toast("받을 수 있는 파일이 없습니다");return;}
   const blob=await zip.generateAsync({type:"blob"});
   saveBlob(blob, zipSafe(zipName||(cname+"_서류전체_"+ymd()),90)+".zip");
   toast(ok+"건 ZIP 다운로드"+(fail?` (${fail}건은 파일이 없어 건너뜀)`:""));
 }

   if(p.del){ toast("삭제 예정인 페이지입니다 · 🗑을 다시 눌러 취소한 뒤 잘라주세요"); return; }
   let Cropper; try{ Cropper=await bpeLoadCropper(); }catch(e){ bpeNotice("자르기를 열지 못했습니다","자르기 모듈 로드 실패: "+((e&&e.message)||e)); return; }
   toast("자르기 편집기 여는 중…");
   let full; try{ full=await bpeCanvas(f,fp.pi,p.rot,1600,null); }catch(e){ bpeNotice("자르기를 열지 못했습니다","페이지 이미지를 만들지 못했습니다: "+((e&&e.message)||e)); return; }
   const src=full.toDataURL("image/png");
   const ov=document.createElement("div"); ov.id="bpeCropOv";
   ov.style.cssText="position:fixed;inset:0;z-index:2700;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:14px";
   ov.innerHTML=`<style>
     .bpc-card{background:#fff;border-radius:14px;width:720px;max-width:96vw;max-height:92vh;overflow:auto;padding:14px 16px 16px;box-shadow:0 14px 44px rgba(0,0,0,.4);display:flex;flex-direction:column}
     .bpc-title{font-size:15px;font-weight:800;margin:0 0 4px;color:#2b2b2b;line-height:1.35;white-space:normal;word-break:break-all}
     .bpc-hint{font-size:12.5px;color:#8a8a8a;margin:0 0 8px;line-height:1.6;white-space:normal}
     .bpc-stage{background:#222;border-radius:10px;overflow:hidden;max-height:56vh;display:flex;align-items:center;justify-content:center}
     .bpc-stage img{display:block;max-width:100%;max-height:100%}
     .bpc-ratios{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
     .bpc-rb{border:1px solid var(--line);background:#fff;color:#3a3a3a;border-radius:22px;padding:10px 15px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
     .bpc-rb.on{background:var(--primary);border-color:var(--primary);color:#fff}
     .bpc-acts{display:flex;gap:8px;margin-top:12px}
     .bpc-acts button{flex:1;border:1px solid var(--line);background:#fff;color:#3a3a3a;border-radius:12px;padding:12px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:normal;line-height:1.3;font-family:inherit}
     .bpc-acts button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
     @media(max-width:760px){
       #bpeCropOv{padding:0;background:#17181a}
       .bpc-card{width:100%;max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;overflow:hidden;background:#17181a;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
       .bpc-title{color:#fff;font-size:13.5px}
       .bpc-hint{color:#b9bbc0;font-size:12px;margin-bottom:10px}
       .bpc-stage{flex:1;min-height:0;max-height:none;background:#0f1012}
       .bpc-ratios{justify-content:center;gap:7px}
       .bpc-rb{background:transparent;border-color:#55575c;color:#e8e8ea;padding:12px 16px;font-size:13px}
       .bpc-acts button{background:transparent;border-color:#55575c;color:#e8e8ea;padding:15px;font-size:14px}
       .bpc-acts button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
     }
   </style>
   <div class="bpc-card">
     <div class="bpc-title">✂ 자르기 · ${esc(f.name)} · ${k+1}쪽</div>
     <p class="bpc-hint">모서리 점을 끌어 남길 부분을 정하세요. 박스 안을 끌면 이동합니다. A4 세로·가로를 누르면 인쇄 용지 비율에 딱 맞게 잘립니다.</p>
     <div class="bpc-stage"><img id="bpeCropImg" src="${src}"></div>
     <div class="bpc-ratios">
       <button class="bpc-rb" id="bcP" onclick="bpeCropRatio('p')">A4 세로</button>
       <button class="bpc-rb" id="bcL" onclick="bpeCropRatio('l')">A4 가로</button>
       <button class="bpc-rb" id="bcF" onclick="bpeCropRatio('free')">자유</button>
       <button class="bpc-rb" onclick="bpeCropRatio('full')" title="자르기 해제(페이지 전체)">전체</button>
     </div>
     <div class="bpc-acts">
       <button onclick="bpeCropClose()">취소</button>
       <button class="pri" onclick="bpeCropApply()">이 영역으로 자르기</button>
     </div>
   </div>`;
   document.body.appendChild(ov);
   const im=document.getElementById("bpeCropImg");
   const init=()=>{
     const cr=new Cropper(im,{viewMode:1,autoCropArea:1,background:false,dragMode:"crop",zoomable:false,rotatable:false,aspectRatio:NaN,
       ready(){ if(p.crop){ const nw=im.naturalWidth, nh=im.naturalHeight;
         cr.setData({x:p.crop.x*nw, y:p.crop.y*nh, width:p.crop.w*nw, height:p.crop.h*nh}); } }});
     _bpeCrop={k,cropper:cr}; bpeCropMark("free");
   };
   if(im.complete) init(); else im.onload=init;
 }
 function bpeCropMark(r){ ["bcP","bcL","bcF"].forEach(i=>{ const b=document.getElementById(i); if(b) b.classList.remove("on"); });
   const on=document.getElementById(r==="p"?"bcP":r==="l"?"bcL":"bcF"); if(on) on.classList.add("on"); }
 function bpeCropRatio(r){ if(!_bpeCrop) return; const cr=_bpeCrop.cropper;
   if(r==="full"){ cr.setAspectRatio(NaN); cr.reset(); bpeCropMark("free"); return; }
   cr.setAspectRatio(r==="p"?595.28/841.89:r==="l"?841.89/595.28:NaN); bpeCropMark(r); }
 function bpeCropClose(){ if(_bpeCrop){ try{ _bpeCrop.cropper.destroy(); }catch(_){ } _bpeCrop=null; } const ov=document.getElementById("bpeCropOv"); if(ov) ov.remove(); }
 async function bpeCropApply(){
   if(!_bpe||!_bpeCrop) return;
   const k=_bpeCrop.k; const cr=_bpeCrop.cropper;
   const im=document.getElementById("bpeCropImg"); const nw=im.naturalWidth||1, nh=im.naturalHeight||1;
   const d=cr.getData(true);
   let x=d.x/nw, y=d.y/nh, w=d.width/nw, h=d.height/nh;
   x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
   w=Math.max(0,Math.min(1-x,w)); h=Math.max(0,Math.min(1-y,h));
   if(!(w>0.02&&h>0.02)){ toast("자를 영역이 너무 작습니다"); return; }
   const {p}=bpePageMeta(k);
   p.crop=(w>0.995&&h>0.995&&x<0.005&&y<0.005)?null:{x,y,w,h};
   _bpe.dirty=true;
   bpeCropClose();
   await bpeRefreshPage(k);
   toast(p.crop?"잘랐습니다 · 💾 저장을 눌러야 실제 파일에 반영됩니다":"자르기를 해제했습니다");
 }
 /* ---- 그리기 ---- */
 async function bpeRenderThumbs(){
   const box=document.getElementById("bpeThumbs"); if(!box||!_bpe) return; box.innerHTML="";
   const reorder=(_bpe.thumbMode!=="select");
   box.onmousedown = reorder ? null : bpeViewMouseDown;
   box.classList.toggle("mode-reorder",reorder); box.classList.toggle("mode-select",!reorder);
   bpeUpdateInfo();
   for(let k=0;k<_bpe.flat.length;k++){ const fp=_bpe.flat[k]; const f=_bpe.files[fp.fi]; const p=f.pages[fp.pi];
     const d=document.createElement("div"); d.className="bpe-th"+(k===_bpe.cur?" on":"")+(p.del?" del":"")+(_bpe.selected.has(k)?" sel":""); d.dataset.uid=p.uid; d.onclick=()=>bpeGo(k);
     if(reorder){
       d.draggable=true;
       d.ondragstart=e=>{ _bpeDrag=k; d.classList.add("drag"); try{e.dataTransfer.effectAllowed="move";}catch(_){ } };
       d.ondragend=()=>{ d.classList.remove("drag"); document.querySelectorAll('.bpe-th.over').forEach(x=>x.classList.remove('over')); };
       d.ondragover=e=>{ e.preventDefault(); d.classList.add("over"); };
       d.ondragleave=()=>{ d.classList.remove("over"); };
       d.ondrop=e=>{ e.preventDefault(); d.classList.remove("over"); bpeDrop(k); };
     }
     try{ d.appendChild(await bpeCanvas(f,fp.pi,p.rot,84,p.crop)); }catch(_){ }
     const n=document.createElement("div"); n.className="n"; n.textContent=(k+1); d.appendChild(n);
     if(p.del){ const dx=document.createElement("div"); dx.className="dx"; dx.textContent="삭제"; d.appendChild(dx); }
     box.appendChild(d);
   }
 }
 function bpeSetThumbMode(m){ if(!_bpe) return; _bpe.thumbMode=m;
   const r=document.getElementById("bpeModeReorder"), s=document.getElementById("bpeModeSelect");
   if(r) r.classList.toggle("act",m==="reorder"); if(s) s.classList.toggle("act",m==="select");
   _bpe.selected=new Set(); bpeRenderThumbs(); bpeApplySel(); }
 async function bpeRenderView(){
   const v=document.getElementById("bpeView"); if(!v||!_bpe) return; v.innerHTML="";
   const maxw=Math.min(560,(v.clientWidth||600)-40);
   const dpr=Math.min(Math.max(window.devicePixelRatio||1,1),3);  // 화면 픽셀밀도만큼 크게 그려 미리보기를 선명하게(표시 크기는 CSS가 줄여 준다)
   for(let k=0;k<_bpe.flat.length;k++){
     const {f,p,fp}=bpePageMeta(k);
     const wrap=document.createElement("div"); wrap.className="bpe-pgwrap"+(p.del?" del":""); wrap.id="bpe-pg-"+k; wrap.dataset.uid=p.uid;
     const ov=document.createElement("div"); ov.className="bpe-pgov";
     ov.innerHTML=`<span class="bpe-pgtag">📄 ${esc(f.name)} · ${k+1}p</span><button onclick="bpeRotAt(${k},-90)" title="왼쪽 회전">↺</button><button onclick="bpeRotAt(${k},90)" title="오른쪽 회전">↻</button><button onclick="bpeCropAt(${k})" title="자르기">✂</button><button class="del" onclick="bpeDelAt(${k})" title="삭제/취소">🗑</button>`;
     wrap.appendChild(ov);
     const inner=document.createElement("div"); inner.className="bpe-pgc";
     try{ inner.appendChild(await bpeCanvas(f,fp.pi,p.rot,Math.round(maxw*dpr),p.crop)); }catch(_){ }
     wrap.appendChild(inner);
     if(p.del){ const dn=document.createElement("div"); dn.className="bpe-delflag"; dn.textContent="삭제 예정 (🗑 다시 눌러 취소)"; wrap.appendChild(dn); }
     v.appendChild(wrap);
   }
   bpeUpdateInfo();
   v.onscroll=()=>{ if(!_bpe) return; const br=v.getBoundingClientRect(); let cur=0; for(let k=0;k<_bpe.flat.length;k++){ const w=document.getElementById("bpe-pg-"+k); if(!w) continue; if(w.getBoundingClientRect().top - br.top <= 90) cur=k; else break; } _bpe.cur=cur; bpeMarkThumb(cur); const th=document.querySelectorAll('.bpe-th')[cur]; if(th) th.scrollIntoView({block:"nearest"}); };
   v.onmousedown=bpeViewMouseDown; bpeApplySel();
 }
 async function bpeRefreshPage(k){
   if(!_bpe) return; const {f,p,fp}=bpePageMeta(k);
   const w=document.getElementById("bpe-pg-"+k);
   if(w){ w.classList.toggle("del",p.del);
     const inner=w.querySelector(".bpe-pgc"); if(inner){ inner.innerHTML=""; const _dpr=Math.min(Math.max(window.devicePixelRatio||1,1),3); try{ inner.appendChild(await bpeCanvas(f,fp.pi,p.rot,Math.round(Math.min(560,((document.getElementById("bpeView")||{}).clientWidth||600)-40)*_dpr),p.crop)); }catch(_){ } }
     let dn=w.querySelector(".bpe-delflag"); if(p.del&&!dn){ dn=document.createElement("div"); dn.className="bpe-delflag"; dn.textContent="삭제 예정 (🗑 다시 눌러 취소)"; w.appendChild(dn); } else if(!p.del&&dn){ dn.remove(); }
   }
   const th=document.querySelectorAll('.bpe-th')[k];
   if(th){ th.classList.toggle("del",p.del); const old=th.querySelector("canvas,img"); try{ const nc=await bpeCanvas(f,fp.pi,p.rot,84,p.crop); if(old) th.replaceChild(nc,old); else th.insertBefore(nc,th.firstChild); }catch(_){ }
     let dx=th.querySelector(".dx"); if(p.del&&!dx){ dx=document.createElement("div"); dx.className="dx"; dx.textContent="삭제"; th.appendChild(dx);} else if(!p.del&&dx){ dx.remove(); } }
   bpeUpdateInfo();
 }
 /* 화면 기준 자르기 영역(비율) → PDF 좌표(포인트)로 변환. pdf.js 뷰포트가 회전까지 계산해 주므로 그대로 되돌리면 된다. */
 async function bpePdfCropBox(f,p){
   if(!f.pdfDoc||!p.crop) return null;
   const page=await f.pdfDoc.getPage(p.i+1);
   const total=(((page.rotate||0)+(p.rot||0))%360+360)%360;
   const vp=page.getViewport({scale:1,rotation:total});
   const c=p.crop;
   const a=vp.convertToPdfPoint(c.x*vp.width, c.y*vp.height);
   const b=vp.convertToPdfPoint((c.x+c.w)*vp.width, (c.y+c.h)*vp.height);
   const x=Math.min(a[0],b[0]), y=Math.min(a[1],b[1]);
   const w=Math.abs(b[0]-a[0]), h=Math.abs(b[1]-a[1]);
   if(!(w>1&&h>1)) return null;
   return {x,y,w,h};
 }
 /* ---- 저장 ----
    ★케이스허브는 편집본을 **원래 자리에 덮어쓴다**. 파일 이름·구역·공개 설정이 그대로 유지된다.
    ★한 쪽도 안 남기는 저장은 막는다(파일을 통째로 없애려면 목록에서 삭제를 쓴다). */
 async function bpeSave(){
   if(!_bpe) return;
   const f=_bpe.files[0];
   const keep=f.pages.filter(p=>!p.del);
   if(!keep.length){ toast("최소 한 쪽은 남겨야 합니다. 파일 자체를 없애려면 목록에서 삭제하세요."); return; }
   const changed = keep.length!==f.pages.length || keep.some(p=>p.rot||p.crop) || f.pages.some((p,i)=>p.i!==i);
   if(!changed){ toast("바뀐 내용이 없습니다."); return; }
   toast("저장 중…");
   try{
     let blob, mime;
     if(f.isPdf){
       const src=await PDFLib.PDFDocument.load(f.srcBytes,{ignoreEncryption:true});
       const out=await PDFLib.PDFDocument.create();
       const copied=await out.copyPages(src, keep.map(p=>p.i));
       for(let k=0;k<copied.length;k++){
         const pg=copied[k], kp=keep[k];
         let base=0; try{ base=pg.getRotation().angle||0; }catch(_){ }
         const rot=((base+kp.rot)%360+360)%360; try{ pg.setRotation(PDFLib.degrees(rot)); }catch(_){ }
         if(kp.crop){ try{ const box=await bpePdfCropBox(f,kp); if(box) pg.setCropBox(box.x,box.y,box.w,box.h); }catch(e){ console.warn("PDF 자르기 반영 실패",e); } }
         out.addPage(pg);
       }
       mime="application/pdf";
       blob=new Blob([await out.save()],{type:mime});
     }else{
       const p0=keep[0];
       const rot=((p0.rot||0)%360+360)%360;
       const cv=await bpeCanvas(f,0,rot,4000,p0.crop);
       /* 확장자와 실제 형식이 어긋나지 않게 — .png 는 png 로, 나머지는 jpg 로 다시 만든다 */
       mime=/\.png$/i.test(PV.path||PV.name||"")?"image/png":"image/jpeg";
       blob=await new Promise(r=>cv.toBlob(r,mime,0.92));
       if(!blob) throw new Error("이미지를 만들지 못했습니다");
     }
     const up=await db.storage.from("docs").upload(PV.path,blob,{contentType:mime,upsert:true});
     if(up.error) throw new Error(up.error.message||String(up.error));
     _bpe.dirty=false;
     if(PV.docId) await markDocEdited(PV.docId);   // 언제 수정했는지 남긴다
     logAct(DCID, f.isPdf?`PDF 편집 저장: ${PV.name} (${keep.length}쪽)`:`이미지 편집 저장: ${PV.name}`);
     bpeClose(); closePreview();
     toast("편집한 파일을 저장했습니다.");
   }catch(e){ console.error(e); bpeNotice("저장하지 못했습니다", (e&&e.message)||String(e)); }
 }

 (async()=>{const {data:{session}}=await db.auth.getSession(); if(session) load();})();
 db.auth.onAuthStateChange((ev,session)=>{if(!session&&ev!=="INITIAL_SESSION"){$("#appView").classList.add("hidden");$("#loginView").classList.remove("hidden");toast("로그인이 만료되었습니다. 다시 로그인해 주세요.");}});
</script>
