async function openBundlePageEditor(cid,bid,onlyId,onlyFileIdx){
  if(!filesReady()){ bpeNotice("편집기를 열지 못했습니다","파일 저장소 연결이 아직 안 됐습니다. 새로고침 후 다시 시도해 주세요."); return; }
  const c=ensureItems(findClient(cid));
  let g;
  if(onlyId){ // 개별 서류 모드: 그 서류가 속한 묶음을 찾아 그 서류만 편집
    const base=fileGroups(c).find(x=>x.items.some(it=>String(it.id)===String(onlyId)));
    if(base){ let it=base.items.find(x=>String(x.id)===String(onlyId)); let title=(it&&it.name)||base.btitle;
      if(it && onlyFileIdx!=null && it.files && it.files[onlyFileIdx]){ const fo=it.files[onlyFileIdx]; it={...it, files:[fo]}; title=(fo&&fo.f&&fo.f.name)||title; } // ★개별 파일 모드: 클릭한 그 파일 하나만 편집기에 표시
      g={...base, items:[it], btitle:title}; }
  } else { g=fileGroups(c).find(x=>x.bid===bid); }
  if(!g){ bpeNotice("편집기를 열지 못했습니다", onlyId?"이 서류에서 편집할 파일을 찾지 못했습니다.":"이 묶음에 편집할 파일이 없습니다."); return; }
  toast("페이지 편집기 여는 중…");
  let pdfjsLib;
  try{ pdfjsLib=await Promise.race([ loadPdfJs(), new Promise((_,rj)=>setTimeout(()=>rj(new Error("뷰어(pdf.js) 불러오기 시간 초과 — 인터넷이 느리거나 차단된 상태일 수 있습니다")),25000)) ]); }
  catch(e){ bpeNotice("편집기를 열지 못했습니다","뷰어 로드 실패: "+((e&&e.message)||e)); return; }
  const files=[]; const errs=[];
  for(const it of g.items){ for(const fo of it.files){
    const ext=extOf(fo.f.name).toLowerCase();
    const isImg=[".jpg",".jpeg",".png",".gif",".webp"].includes(ext);
    const isPdf=(ext===".pdf");
    if(!isImg&&!isPdf) continue;
    try{
      const bytes=await fetchFileBytes(fo.f);
      const ent={itemId:it.id, fileRef:fo.f, name:fo.f.name, isPdf, isImg, srcBytes:bytes, npages:1, pages:null, pdfDoc:null, imgUrl:null, imgEl:null};
      if(isPdf){ ent.pdfDoc=await pdfjsLib.getDocument({data:(bytes instanceof Uint8Array)?bytes.slice(0):new Uint8Array(bytes)}).promise; ent.npages=ent.pdfDoc.numPages; }
      else { ent.imgUrl=URL.createObjectURL(new Blob([bytes])); ent.imgEl=await _bpeLoadImg(ent.imgUrl); }
      ent.pages=Array.from({length:ent.npages},(_,k)=>({i:k,rot:0,del:false}));
      files.push(ent);
    }catch(e){ console.warn("편집기 파일 로드 실패",fo.f.name,e); errs.push(fo.f.name+" → "+((e&&e.message)||e)); }
  } }
  if(!files.length){ bpeNotice("편집기를 열지 못했습니다", errs.length?("파일을 불러오지 못했습니다.\n"+errs.join("\n")):"편집할 수 있는 파일(PDF·이미지)이 없습니다."); return; }
  files.forEach((f,fi)=>f.pages.forEach(p=>{ p.uid=fi+"_"+p.i; })); // 페이지 고유 식별자(순서 바뀌어도 DOM 추적용)
  const flat=[]; files.forEach((f,fi)=>f.pages.forEach((p,pi)=>flat.push({fi,pi})));
  _bpe={cid,bid:(g.bid||bid),btitle:g.btitle,files,flat,cur:0,dirty:false,selected:new Set(),thumbMode:"reorder"};
  const d=document.createElement("div"); d.id="bpeOv";
  d.style.cssText="position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:14px";
  d.innerHTML=`<style>
    .bpe-card{background:#fff;border-radius:12px;overflow:hidden;width:940px;max-width:96vw;height:82vh;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(0,0,0,.4)}
    .bpe-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line,#e3e3e3)}
    .bpe-head .t{font-size:14px;font-weight:700}
    .bpe-head .x{margin-left:auto;font-size:19px;color:#8a8a8a;cursor:pointer}
    .bpe-tb{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line,#e3e3e3);background:#f7f7f8}
    .bpe-tbtn{display:flex;align-items:center;gap:4px;font-size:12.5px;padding:7px 11px;border:1px solid var(--line,#e3e3e3);background:#fff;border-radius:8px;cursor:pointer}
    .bpe-tbtn.save{background:var(--brand,#9B1B33);color:#fff;border-color:var(--brand,#9B1B33);font-weight:700}
    .bpe-tbtn.del{color:#b3261e}
    .bpe-sep{width:1px;height:18px;background:var(--line,#e3e3e3);margin:0 3px}
    .bpe-info{margin-left:auto;font-size:11.5px;color:#8a8a8a}
    .bpe-body{display:flex;flex:1;min-height:0}
    .bpe-thumbs{width:100px;flex:0 0 100px;background:#2b2e33;overflow:auto;padding:8px 6px}
    .bpe-th{background:#fff;border-radius:4px;margin-bottom:8px;border:2px solid transparent;cursor:pointer;padding:3px;position:relative}
    .bpe-th.on{border-color:var(--brand,#9B1B33)}

    } else {

      const cv=await bpeCanvas(f,0,rot,4000);
      newBytes=await new Promise(r=>cv.toBlob(b=>b.arrayBuffer().then(r),"image/jpeg",0.92));
      newMime="image/jpeg";
      newName=(f.name||"image").replace(/\.[^.]+$/,"").replace(/_(편집|이동)$/,"")+"_이동.jpg";
    }
    const j=await gwUpload(clientFolder(c), newName, newMime, newBytes);
    if(!await gwVerify(j.id, newBytes.byteLength)) throw new Error("이동 파일 저장 검증 실패("+newName+") — 원본 그대로 유지");
    const nf={name:newName, size:(newBytes.byteLength||0), driveId:j.id, by:deviceName||"미설정", ts:now(), is_public:!!(f.fileRef&&f.fileRef.is_public)};

      const _doc={client_id:_bpe.cid, doc_key:tgtDkey, file_name:newName, storage_path:j.id, uploaded_by:nf.by, is_public:nf.is_public, kind:"취합"};

async function fetchFileBytes(f){
  const key=f.driveId||f.sha;
  if(key && _byteCache.has(key)) return _byteCache.get(key);
  let bytes;
  if(f.driveId){ bytes=await gwFetchBytes(f.driveId); }
  else {
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/blobs/${f.sha}`,{headers:ghHeaders()});
    if(!r.ok) throw new Error("HTTP "+r.status);

    bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

  if(key && bytes){ try{ _byteCache.set(key,bytes); }catch(_){} }

async function pvbDoMove(tgtId){

  if(!c.items[tgtId]){ toast("대상 서류를 찾을 수 없습니다"); return; }
  pvbCloseMove(); toast("이동 중…"); setSync("saving");

    // 1) 서버 먼저: 이미 서버에 기록된 파일(docId)이면 소속(doc_key) 변경. 성공해야 다음으로.

      const tgtDkey = (typeof ITEM_BY_ID!=="undefined" && ITEM_BY_ID[tgtId]) ? tgtId : ((c.items[tgtId].doc_key)||tgtId);
      const r=await sb.from("documents").update({doc_key:tgtDkey}).eq("id",f.docId);
      if(r.error) throw r.error;
    }
    // 2) 화면 데이터: 원본에서 빼서 대상으로
    arr.splice(ctx.idx,1);
    if(!c.items[tgtId].files) c.items[tgtId].files=[];
    c.items[tgtId].files.push(f);
    // 3) 상태 재계산 + 순서 저장 + 동기화
    try{ applyTags(c); }catch(_){}
    touch(`[${c.name}] '${itemName(ctx.srcId,c)}' → '${itemName(tgtId,c)}' 파일 이동: ${f.name}`);
    if(typeof BACKEND!=="undefined" && BACKEND==="supabase"){ try{ await sbSaveFileOrder(ctx.cid,tgtId); await sbSaveFileOrder(ctx.cid,ctx.srcId); }catch(_){} }
    try{ pvbPushRecent(tgtId); }catch(_){ }
    closeModal(); renderDetail(ctx.cid);

async function pvbRenderPdf(bytes, bigEl, thumbEl, token){
  const ctx=_pvbCtx;
  const pdfjsLib=await loadPdfJs();
  if(!ctx || ctx.token!==token) return;

    const page=await pdf.getPage(n);
    const base=page.getViewport({scale:1});
    const scale=Math.max(0.3,Math.min(3,cw/base.width));
    const vp=page.getViewport({scale:scale*dpr});
    const canvas=document.createElement("canvas");
    canvas.width=vp.width; canvas.height=vp.height;
    canvas.style.width=(base.width*scale)+"px"; canvas.style.maxWidth="100%"; canvas.style.height="auto";
    canvas.style.display="block"; canvas.style.margin="0 auto 10px"; canvas.style.borderRadius="6px"; canvas.style.background="#fff";
    canvas.id="pvbpg-"+n;

    const tvp=page.getViewport({scale:(150/base.width)*dpr});
    const tc=document.createElement("canvas");
    tc.width=tvp.width; tc.height=tvp.height;
    const wrap=document.createElement("div"); wrap.className="pvb-thumb"; wrap.dataset.n=n;
    wrap.onclick=()=>{ const t=document.getElementById("pvbpg-"+n); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); pvbMarkThumb(n); };
    wrap.appendChild(tc);

  }

  // 큰 미리보기를 스크롤하면 현재 보는 페이지의 썸네일이 자동으로 강조되고 썸네일 목록도 따라 스크롤됨
  bigEl.onscroll=()=>{ const br=bigEl.getBoundingClientRect(); let cur=1;

    pvbMarkThumb(cur); const tw=thumbEl.querySelector('.pvb-thumb[data-n="'+cur+'"]'); if(tw) tw.scrollIntoView({block:"nearest",inline:"nearest"}); };
  pvbMarkThumb(1);
}

function copyCertPw(){
  const e=document.getElementById("cert_pw"); const v=e?e.value:"";
  if(!v){ toast("복사할 비밀번호가 없습니다"); return; }
  Promise.resolve(copyText(v)).then(ok=>toast(ok?"비밀번호를 복사했습니다":"복사 실패 — 직접 선택해 복사해 주세요"));

function attachCertFiles(cid){
  if(!filesReady()){ toast("인증서 파일 첨부는 드라이브 연결 후 가능합니다"); return; }
  const inp=document.createElement("input"); inp.type="file"; inp.multiple=true;
  inp.onchange=async()=>{ const files=[...inp.files]; if(!files.length) return; const c=findClient(cid); if(!c.cert)c.cert={files:[],pw:""};
    for(const f of files){ if(f.size>150*1024*1024){ toast(`${f.name}: 150MB 초과`); continue; }
      setSync("saving"); toast(`${f.name} 업로드 중…`);
      const lid=dlog("start","공동인증서 첨부",{client_name:c.name, files:1, bytes:f.size});
      try{ const j=await gwUpload(clientFolder(c)+"_인증서", f.name, f.type||"application/octet-stream", f);
        c.cert.files.push({name:f.name,size:f.size,driveId:j.id,ts:now()});
        dlogEnd(lid,{kind:"done"});
      }catch(e){ dlogEnd(lid,{kind:"fail",detail:String(e.message||e).slice(0,300)}); toast(`${f.name} 실패: ${e.message}`); setSync("error"); } }
    dlogFlush();
    touch(`[${c.name}] 공동인증서 첨부`); openCert(cid);
  };
  inp.click();
}
async function openCertFile(cid,idx){ const c=findClient(cid); const f=(c.cert.files||[])[idx]; if(!f) return; await downloadBlobBySha(f); }
async function removeCertFile(cid,idx){ const c=findClient(cid); const f=(c.cert.files||[])[idx]; if(!f) return; if(!confirm(`'${f.name}' 인증서 파일을 삭제할까요?`)) return;
  if(f.driveId){ try{ await gwDelete(f.driveId); }catch(_){} }
  else if(githubReady() && f.path){ try{ await fetch(ghContentsUrl(f.path),{method:"DELETE",headers:Object.assign({"Content-Type":"application/json"},ghHeaders()),body:JSON.stringify({message:`delete cert ${f.name}`,sha:f.sha,branch:cfg.branch})}); }catch(_){} }
  c.cert.files.splice(idx,1); touch(`[${c.name}] 인증서 삭제`); openCert(cid);
}
async function downloadBlobBySha(f){ toast("파일 여는 중…"); try{ const bytes=await fetchFileBytes(f); const ext=String(f.name||"").split(".").pop().toLowerCase(); const type=ext==="zip"?"application/zip":"application/octet-stream"; dlBlob(new Blob([bytes],{type}), f.name); }catch(e){ toast("열기 실패: "+e.message); } }

function logMessage(c, text, via){
  if(!c || !text || !text.trim()) return;
  text=text.trim();
  if(!c.msgLog) c.msgLog=[];
  const last=c.msgLog[c.msgLog.length-1];
  if(last && last.text===text && (Date.now()-new Date(last.ts).getTime())<60000) return; // 1분 내 동일내용 중복 방지
  const items=(_msgCtx && _msgCtx.list)?_msgCtx.list.filter(x=>_msgCtx.sel.has(x.id)).map(x=>x.name):[];
  c.msgLog.push({ ts:now(), kind:(_msgCtx?_msgCtx.kind:"request"), tone:(_msgCtx?_msgCtx.tone:""), via:via||"", items, text });
  if(c.msgLog.length>60) c.msgLog=c.msgLog.slice(-60);
}

function internalCheck(cid,id,el){
  const c=findClient(cid); const s=c.items[id]; if(!s) return;
  s.done=el.checked;
  if(el.checked){ s.recvDate=now(); s.rejected=false; if(s.mode==="request") s.reqTag="received"; } else { s.recvDate=null; }
  const lab=el.closest("label"); if(lab){ lab.style.opacity=el.checked?"0.5":"1"; const b=lab.querySelector("b"); if(b) b.style.textDecoration=el.checked?"line-through":"none"; }
  touch(`[${c.name}] '${itemName(id,c)}' ${el.checked?"확보 완료":"미확보"} (내부 미비체크)`);
}
function copyInternalMissing(cid,save){
  const c=findClient(cid); const name=(c.name||"의뢰인").trim(); const list=selfMissingItems(c);
  if(list.length===0){ toast("남은 미비서류가 없습니다 ✓"); return; }
  let t=`[${name}_미비서류] 직접발급 필요\n\n`;
  list.forEach((x,i)=>{ t+=`${i+1}. ${x.name}\n`; });
  t+=`\n총 ${list.length}건 · 작성 ${fmt(now())}`;
  copyText(t).then(ok=>{
    if(save){ if(!c.msgLog) c.msgLog=[]; c.msgLog.push({ts:now(),kind:"internal",via:"내부 미비서류",items:list.map(x=>x.name),text:t}); if(c.msgLog.length>60) c.msgLog=c.msgLog.slice(-60); touch(`[${c.name}] 미비서류 목록 기록 저장`); }
    toast(ok?(save?"복사 + 기록 저장 ✓":"미비서류 목록 복사 ✓"):"복사 실패 — 직접 선택해 복사하세요");
  });
}
function copySummary(cid){
  const c=ensureItems(findClient(cid)); const p=progress(c);
  const buckets={recv:[],reqing:[],notreq:[],self:[]};
  const push=(it)=>{ const s=c.items[it.id]; if(!s||s.mode==="na") return;
    if(s.done) buckets.recv.push(it.name);
    else if(s.mode==="request"){ if(s.reqTag==="requesting") buckets.reqing.push(it.name); else buckets.notreq.push(it.name); }
    else buckets.self.push(it.name); };
  TEMPLATE.forEach(b=>b.groups.forEach(g=>g.items.forEach(push)));
  Object.keys(c.extra||{}).forEach(bid=>(c.extra[bid]||[]).forEach(push));
  let t=`[${c.name}] 개인회생 서류 진행상황 (${fmtD(now())})\n`;
  t+=`사건: ${c.caseType||"개인회생"}${c.caseNo?(" "+c.caseNo):""}\n`;
  t+=isBJOnly(c)?`보정만 넘겨받은 사건 · 서류취합 없음\n\n`:`확보 ${p.done}/${p.total} (${p.pct}%)\n\n`;
  if(buckets.reqing.length) t+=`■ 요청중(회신 대기): ${buckets.reqing.join(", ")}\n`;
  if(buckets.notreq.length) t+=`■ 미요청(요청 필요): ${buckets.notreq.join(", ")}\n`;
  if(buckets.self.length) t+=`■ 직접발급 예정: ${buckets.self.join(", ")}\n`;
  if(buckets.recv.length) t+=`■ 확보 완료: ${buckets.recv.join(", ")}\n`;
  if(c.memo) t+=`\n[메모] ${c.memo}\n`;
  copyText(t).then(ok=>toast(ok?"진행상황을 복사했습니다 ✓ (노션·시트에 붙여넣기)":"복사 실패"));
}

/* ---------- 저장공간 정리(관리자 전용): 어떤 서류·인증서·앱데이터에도 연결 안 된 파일만 안전하게 비움 ---------- */
let _sscOrphans=[];
async function _sscCollectRefs(){ // 참조되는 저장경로 모두 수집(문서+인증서+앱스냅샷). ★한 곳이라도 실패하면 예외를 던져 정리를 중단(참조 누락→오삭제 방지)
  const ref=new Set();
  { let pg=0; while(true){ const r=await sb.from("documents").select("storage_path").range(pg*1000,pg*1000+999); if(r.error) throw new Error("문서 목록 조회 실패: "+(r.error.message||r.error)); if(!r.data||!r.data.length) break; r.data.forEach(d=>{ if(d.storage_path) ref.add(d.storage_path); }); if(r.data.length<1000) break; pg++; } }
  /* ★1,000줄 한계 주의: 참조 목록을 덜 모으면 멀쩡한 파일을 '고아'로 오인해 지운다 → 반드시 끝까지 이어 받는다 */
  { const s=await sbSelectPaged("secrets","id,cert_files"); if(s.error) throw new Error("인증서 목록 조회 실패: "+(s.error.message||s.error)); (s.data||[]).forEach(row=>{ let arr=row.cert_files; if(typeof arr==="string"){ try{arr=JSON.parse(arr);}catch(_){arr=[];} } (arr||[]).forEach(f=>{ if(f&&f.driveId) ref.add(f.driveId); }); }); }
  { const c=await sbSelectPaged("clients","id,app_json"); if(c.error) throw new Error("의뢰인 데이터 조회 실패: "+(c.error.message||c.error)); const rx=/u\/[^"'\\\s]+?\.[A-Za-z0-9]{1,10}/g; (c.data||[]).forEach(row=>{ let t=row.app_json; if(t&&typeof t!=="string") t=JSON.stringify(t); if(t){ const m=t.match(rx); if(m) m.forEach(p=>ref.add(p)); } }); }
  return ref;
}
async function _sscListObjects(){ // 저장소 전체 객체 나열(폴더별 병렬 조회로 빠르게)
  async function la(prefix){ let all=[],pg=0; while(true){ const {data,error}=await sb.storage.from("docs").list(prefix,{limit:1000,offset:pg*1000}); if(error) throw new Error("저장소 목록 조회 실패: "+(error.message||error)); if(!data||!data.length) break; all=all.concat(data); if(data.length<1000) break; pg++; } return all; }
  const top=await la("u");
  const folders=top.filter(e=>e.id===null||e.metadata==null);
  const objs=top.filter(e=>!(e.id===null||e.metadata==null)).map(e=>({path:"u/"+e.name,size:e.metadata.size,created:e.created_at}));
  const lists=await Promise.all(folders.map(f=>la("u/"+f.name).then(files=>({name:f.name,files})).catch(err=>{ throw err; })));
  for(const {name,files} of lists){ for(const x of files){ if(x.metadata&&x.metadata.size!=null){ objs.push({path:"u/"+name+"/"+x.name,size:x.metadata.size,created:x.created_at}); } else { const sub=await la("u/"+name+"/"+x.name); for(const s2 of sub){ if(s2.metadata&&s2.metadata.size!=null) objs.push({path:"u/"+name+"/"+x.name+"/"+s2.name,size:s2.metadata.size,created:s2.created_at}); } } } }
  return objs;
}
async function openStorageCleanup(){
  if(!sbInit()){ toast("클라우드(케이스허브) 연결 후 이용하세요"); return; }
  try{ const rr=await sb.rpc("my_role"); if(rr.data!=="master"){ toast("저장공간 정리는 관리자(master)만 할 수 있습니다"); return; } }catch(_){ toast("권한 확인 실패 — 잠시 후 다시"); return; }
  modal(`<h3>🧹 저장공간 정리</h3><div id="sscBody" style="padding:14px 2px;font-size:13px;color:#555;text-align:center">저장소를 점검하는 중… (파일이 많으면 20~30초 걸릴 수 있어요)</div><div class="modal-actions"><button class="btn" onclick="closeModal()">닫기</button></div>`);
  try{
    const ref=await _sscCollectRefs();
    const objs=await _sscListObjects();
    // ★멀티테넌트 안전: 지금 로그인 사용자가 볼 수 있는 의뢰인 폴더만 대상 + 폴더→의뢰인 이름 매핑
    const dirName={};
    ((state&&state.clients)||[]).forEach(c=>{ try{ const b=(clientFolder(c)||"").replace(/[^\w\-]/g,"")||"uploads"; dirName[b]=c.name||"의뢰인"; const cf=((clientFolder(c)||"")+"_인증서").replace(/[^\w\-]/g,"")||"uploads"; dirName[cf]=(c.name||"의뢰인")+" · 인증서"; }catch(_){ } });
    const allowed=new Set(Object.keys(dirName));
    // ★★최종 안전망: 지금 화면(state)에 로드된 모든 의뢰인의 파일·인증서 driveId와 직접 대조 → 하나라도 겹치면 무조건 제외(=지금 목록에 보이는 파일은 절대 안 지움)
    const liveRefs=new Set();
    ((state&&state.clients)||[]).forEach(c=>{ try{ Object.values(c.items||{}).forEach(s=>{ (s&&s.files||[]).forEach(f=>{ if(f&&f.driveId) liveRefs.add(f.driveId); }); }); ((c.cert&&c.cert.files)||[]).forEach(f=>{ if(f&&f.driveId) liveRefs.add(f.driveId); }); }catch(_){ } });
    const nowMs=Date.now();
    const orphans=objs.filter(o=>{ if(ref.has(o.path)||liveRefs.has(o.path)) return false; if(nowMs-new Date(o.created).getTime()<=86400e3) return false; const dir=(o.path.split("/")[1])||""; return allowed.has(dir); }) // 참조안됨(DB+화면) + 24h경과 + 내가 보는 의뢰인 폴더
      .map(o=>{ o.client=dirName[(o.path.split("/")[1])||""]||"(알 수 없음)"; return o; })
      .sort((a,b)=> a.client<b.client?-1 : a.client>b.client?1 : b.size-a.size);
    _sscOrphans=orphans;
    const usedMB=+(objs.reduce((a,o)=>a+o.size,0)/1048576).toFixed(1);

function _sscUpd(){ const cbs=[...document.querySelectorAll(".ssc-cb")]; let n=0,sz=0; cbs.forEach(cb=>{ if(cb.checked){ n++; const o=_sscOrphans[+cb.dataset.idx]; if(o) sz+=o.size; } }); const el=document.getElementById("sscSel"); if(el) el.textContent=`${n}개 선택 · 약 ${(sz/1048576).toFixed(1)}MB`; const b=document.getElementById("sscDelBtn"); if(b) b.textContent=n?`🧹 ${n}개 비우기 (약 ${(sz/1048576).toFixed(1)}MB)`:"🧹 선택 비우기"; }

async function _sscRun(){
  const cbs=[...document.querySelectorAll(".ssc-cb")];
  const chosen=cbs.filter(cb=>cb.checked).map(cb=>_sscOrphans[+cb.dataset.idx]).filter(Boolean);
  if(!chosen.length){ toast("선택된 파일이 없습니다"); return; }
  if(!confirm(`선택한 ${chosen.length}개 파일을 영구 삭제합니다. 계속할까요?\n(체크 푼 파일과 실제 사용 중인 서류·인증서는 지워지지 않습니다)`)) return;
  const body=document.getElementById("sscBody");
  const paths=chosen.map(o=>o.path); let done=0, failed=0;
  try{
    for(let i=0;i<paths.length;i+=100){ const batch=paths.slice(i,i+100);
      const {error}=await sb.storage.from("docs").remove(batch);
      if(error){ failed+=batch.length; } else { done+=batch.length; }
      if(body){ body.style.textAlign="center"; body.innerHTML=`<div style="text-align:center;padding:16px;font-size:14px">비우는 중… ${Math.min(i+100,paths.length)}/${paths.length}</div>`; }
    }
    _sscOrphans=[];
    if(body){ body.style.textAlign="center"; body.innerHTML=`<div style="background:#e7f5ec;border-radius:9px;padding:14px;color:#0a7d3c;font-weight:700">정리 완료 ✓<br><span style="font-weight:400;color:#555;font-size:12.5px">${done}개 삭제${failed?` · ${failed}개 실패(다시 시도 가능)`:""}</span></div>`; }
    const act=body&&body.parentNode.querySelector(".modal-actions"); if(act) act.innerHTML=`<button class="btn btn-primary" onclick="closeModal()">확인</button>`;
    toast(`저장공간 정리: ${done}개 삭제 완료`);
  }catch(e){ console.error(e); toast("정리 중 오류: "+((e&&e.message)||e)); }
}

function _ibFiledCount(f){ return f.filedSlots? Object.values(f.filedSlots).reduce((a,b)=>a+b,0):0; }

function _ibUnassigned(){ return _ib.filter(f=>!_ibIsFiled(f)); }

async function _ibUnassignOne(c,f){

async function _ibUnassign(fileId){

function _ibTallyTotal(){ let t=0,orig=0; _ib.forEach(f=>{ t+=_ibFiledCount(f); if(f.origSaved) orig++; }); return {t,orig}; }

function _ibComplete(){

  if(origN>0) list+=`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#2b2b2b;padding:3px 0"><span style="color:#9B1B33">🗂</span> 그 외 서류 · [원본] 보관 <span style="margin-left:auto;color:#0a7d3c;font-weight:800">${origN}건</span></div>`;

}

function _ibPick(){ const inp=document.createElement("input"); inp.type="file"; inp.multiple=true; inp.accept="image/*,application/pdf,.pdf,.xlsx,.xls,.docx,.doc,.hwp,.ppt,.pptx,.txt,.csv";

function _ibThumb(f){
  const box=document.createElement("div"); box.className="ib-thumb"; box.title="크게 보기";
  box.textContent=_ibIsPdf(f)?"PDF":(_ibIsImg(f)?"IMG":"?"); box.onclick=()=>_ibPreview(f.id);

      const ub=document.createElement("button"); ub.className="ib-btn sm"; ub.style.cssText="white-space:nowrap;color:#b3261e;border-color:#e6b3b0"; ub.textContent="✕ 배정 취소"; ub.onclick=()=>_ibUnassign(f.id); row.appendChild(ub); }

function _ibSlotsHtml(q){
  q=(q||"").trim().toLowerCase(); const c=_ibCli(); let body="";
  TEMPLATE.forEach(b=>{
    const rows=[];
    b.groups.forEach(g=>g.items.forEach(it=>{ if(!q||it.name.toLowerCase().includes(q)) rows.push({id:it.id,name:it.name,note:it.note}); }));
    (((c&&c.extra&&c.extra[b.id]))||[]).forEach(ex=>{ if(!q||(ex.name||"").toLowerCase().includes(q)) rows.push({id:ex.id,name:ex.name,note:"추가서류"}); });
    if(!rows.length) return;
    body+=`<div class="ib-sgrp">${esc(b.title)}</div>`;
    rows.forEach(it=>{ const nt=(it.note||"").slice(0,16); body+=`<div class="ib-sitem" data-s="${esc(it.id)}"><span>${esc(it.name)}</span>${nt?`<span class="nt">${esc(nt)}</span>`:""}</div>`; });

async function _ibUploadFile(c, fobj, slot){

  catch(e){ await sbRollbackUpload(c, slot, ent, e); throw new Error("서버 저장 실패("+file.name+"): "+(e.message||e)); }

async function _ibDoAssign(slot){

  _ibBusy=true;

      if(!targets.length){ _ibClosePick(); _ibBusy=false; return; }

      /* 한 개씩 순차 업로드 — 동시 업로드 시 파일 전체를 메모리에 함께 올려 튕김(브라우저 강제 종료) 유발하므로 순차 처리 */

        _ibLid=dlog("start","받은파일함 1개배정",{client_name:c.name, slot:itemName(slot,c), files:1, bytes:(f.file&&f.file.size)||0});
        await _ibUploadFile(c,f,slot); _ibAddFiled(f, itemName(slot,c), 1); touch(`[${c.name}] 받은 파일함 → '${itemName(slot,c)}' 1개 배정`);

  finally{ _ibBusy=false; if(holdRestore(c,_hold)) touch(`[${c&&c.name}] 보류 유지`); }
}

async function _ibUnsplit(driveId){
  if(_ibBusy){ toast("처리 중입니다 — 잠시만요"); return; }
  const f=_ib.find(x=>x.id===_ibSplitFid); if(!f) return;
  const c=ensureItems(_ibCli()); if(!c){ toast("의뢰인을 찾을 수 없습니다"); return; }
  const ref=(f._refs||[]).find(r=>r.driveId===driveId); if(!ref){ toast("세트를 찾을 수 없습니다"); return; }
  _ibBusy=true; toast("이 세트 배정 취소 중…");
  try{
    const s=c.items[ref.slot];
    if(s&&s.files){ const idx=s.files.findIndex(x=>x.driveId===driveId);
      if(idx>=0){ const fe=s.files[idx];
        try{ await gwDelete(fe.driveId); }catch(_){}
        if(BACKEND==="supabase" && fe.docId){ try{ await sb.from("documents").delete().eq("id",fe.docId); }catch(_){} }
        s.files.splice(idx,1); } }
    const pgs=(ref.pages&&ref.pages.length)?ref.pages.slice():Object.keys(f.splitPages).filter(p=>f.splitPages[p]===driveId).map(Number);
    pgs.forEach(p=>{ if(f.splitPages[p]===driveId) delete f.splitPages[p]; });
    const label=itemName(ref.slot,c); if(f.filedSlots&&f.filedSlots[label]!=null){ f.filedSlots[label]-=pgs.length; if(f.filedSlots[label]<=0) delete f.filedSlots[label]; }
    f._refs=(f._refs||[]).filter(r=>r.driveId!==driveId);
    if(s) _ibUnmarkReceived(s);
    touch(`[${c.name}] 받은 파일함 분할 세트 취소: ${_ibSlotName(ref.slot)} (${pgs.length}p)`);
    /* 취소된 페이지 셀만 원상복구 → 스크롤 위치 유지 */
    { const grid=$("#ibPgGrid"); if(grid){ pgs.forEach(p=>{ const cell=[...grid.children].find(x=>+x.dataset.p===p); if(!cell)return; cell.classList.remove("done"); delete cell.dataset.set; const tg=cell.querySelector(".ib-pgtag"); if(tg) tg.remove(); }); } }
    _ibRender(); toast("그 세트 배정을 취소했어요 — 페이지를 다시 고를 수 있어요");
  }catch(e){ console.error(e); toast("취소 실패: "+(e.message||e)); setSync("error"); }
  finally{ _ibBusy=false; }
}
function _ibRangeLabel(pages){ const out=[]; let a=pages[0],prev=pages[0];
  for(let i=1;i<=pages.length;i++){ const p=pages[i]; if(p===prev+1){ prev=p; continue; } out.push(a===prev?String(a):a+"-"+prev); a=p; prev=p; }

async function _ibBuildSplit(slot){

    /* 전체 재렌더 대신 방금 배정한 페이지 셀만 갱신 → 스크롤 위치 유지 */
    { const grid=$("#ibPgGrid"); if(grid){ const sName=_ibSlotName(slot);
        pages.forEach(p=>{ const cell=[...grid.children].find(x=>+x.dataset.p===p); if(!cell)return;
          cell.classList.remove("on"); cell.classList.add("done"); cell.dataset.set=j.id;
          let tg=cell.querySelector(".ib-pgtag"); if(!tg){ tg=document.createElement("div"); tg.className="ib-pgtag"; cell.appendChild(tg); } tg.textContent="✓ "+sName; });

}

   documents(첨부파일 장부)가 1,000줄을 넘자, 넘어간 만큼(=최근에 올린 파일)이 화면에서 통째로 사라졌다.

   → 앞으로 모든 목록 조회는 1,000줄씩 끝까지 이어 받는다. */
async function sbSelectPaged(table, cols){
  const PAGE=1000; let out=[];
  for(let pg=0; pg<1000; pg++){                       // 최대 100만 줄까지 안전하게
    const r=await sb.from(table).select(cols).order("id").range(pg*PAGE, pg*PAGE+PAGE-1);
    if(r.error) return {data:null, error:r.error};
    const rows=r.data||[];
    out=out.concat(rows);
    if(rows.length<PAGE) break;                       // 마지막 장
  }
  return {data:out, error:null};
}

   이제: 올린 즉시 장부에 쓰고, 그게 성공해야 화면에 남긴다. 실패하면 올린 파일을 지우고 오류를 알린다.
   → "화면에 보이면 서버에 저장된 것" 이 보장된다. */
async function sbSaveDocNow(c, slot, ent){
  if(typeof BACKEND==="undefined" || BACKEND!=="supabase") return;   // 드라이브(문지기) 모드는 기존 방식 유지
  if(!sbInit() || !sbUser) return;
  if(!isUuid(c.id)) return;              // 아직 서버에 없는 새 의뢰인 → 자동저장이 의뢰인부터 만든 뒤 기록
  const s=c.items[slot]||{};
  const dkey=(typeof ITEM_BY_ID!=="undefined" && ITEM_BY_ID[slot]) ? slot : (s.doc_key||slot);
  const doc={ client_id:c.id, doc_key:dkey, file_name:ent.name, storage_path:ent.driveId,
              uploaded_by:ent.by||deviceName||"직원", is_public:!!ent.is_public, kind:"취합" };
  if(SB_HAS_SORT) doc.sort_order=Math.max(0,((s.files||[]).length-1));
  const r=await sb.from("documents").insert(doc).select("id").single();
  if(r.error) throw r.error;
  if(!r.data || !r.data.id) throw new Error("저장 권한이 없어 파일 기록이 서버에 남지 않았습니다");
  ent.docId=r.data.id;
}

  dlogFlush();
}
async function sbSaveFileOrder(cid,id){

/* 케이스허브 status → 화면 항목 상태로 환원.

     여기서는 받음/요청중/보완필요/해당없음만 덮어쓴다. '미요청'은 기본값 그대로(해당없음 숨김 유지). */
function sbApplyStatus(s, status, reason){
  if(status==="해당없음"){ s.mode="na"; return; }
  if(status==="받음"){ s.done=true; s.reqTag="received"; }
  else if(status==="요청중"){ s.reqTag="requesting"; }
  else if(status==="보완필요"){ s.rejected=true; s.rejectReason=reason||""; }

  if((status==="받음"||status==="요청중"||status==="보완필요") && s.mode==="na") s.mode="request"; // 받았는데 숨김이면 보이게
}
/* Supabase 한 줄(clients row) + 그 의뢰인의 체크리스트 줄들 → 화면 client 객체로 재조립 */
function sbBuildClient(row, rows, docs, memos, secret){
  let aj={}; try{ aj=(typeof row.app_json==="string")?JSON.parse(row.app_json):(row.app_json||{}); }catch(_){ aj={}; }

    stage: ((aj.stage2 && STAGES.includes(aj.stage2) && SB_STAGE_FWD[aj.stage2]===row.stage) ? aj.stage2 : (SB_STAGE_BACK[row.stage]||"서류수집")), deadline: row.court_deadline||null,

    firm: aj.firm || sbFirmFromOffice(row.office_id) || cfg.firmName, isPublic:!!row.is_public, createdAt: row.created_at, updatedAt: row.updated_at, _sbId: row.id, office_id: row.office_id,

  (rows||[]).forEach(r=>{
    let id = (r.doc_key && ITEM_BY_ID[r.doc_key]) ? r.doc_key : SB_NAME2ID[sbNorm(r.doc_name)];

      /* (수정 2026-07-20) status==='해당없음'만 보고 manual=true를 찍던 로직 제거. 태그(소득·주거·재산)로 자동 숨김돼 서버에 '해당없음'으로 저장된 서류까지 '사람이 손으로 숨긴 것'으로 오인해 동결시켜, 나중에 재산·주거를 바꿔도 서류가 안 살아나던 버그의 원인이었다. 손으로 숨긴 서류는 app_json.manualNa로 정확히 복원한다(아래 manualNa 복원 줄). */
      if((r.status==="요청중"||r.status==="받음"||r.status==="보완필요") && NA_DEFAULT.indexOf(id)>=0) c.items[id].manual=true; // ★기본 '해당없음'인 서류(해약환급금 등)에 활성 상태가 서버에 저장돼 있으면 = 사람이 손으로 켠 것 → 새로고침해도 자동으로 '해당없음'으로 안 되돌림(기존 데이터 보호)
      if(r.memo) c.items[id].memo=r.memo;

      const bid=SB_BUNDLE_BID[r.bundle]||"b5", xid="sb_"+r.id;
      c.items[xid]={ mode:"request", reqTag:"none", done:false, memo:r.memo||"", reqDate:null, recvDate:null, link:"", rejected:false, rejectReason:"", files:[], manual:true, _sbRow:r.id, _bj:(r.doc_key&&r.doc_key.indexOf("bj_")===0) };
      sbApplyStatus(c.items[xid], r.status, r.reject_reason);

  (docs||[]).slice().sort((a,b)=>{ const A=(a.sort_order==null?1e9:a.sort_order), B=(b.sort_order==null?1e9:b.sort_order); return (A-B) || String(a.created_at||"").localeCompare(String(b.created_at||"")); }).forEach(d=>{

  });
  ensureItems(c);
  (aj.manualNa||[]).forEach(id=>{ const s=c.items[id]; if(s && !(s.files&&s.files.length)){ s.mode="na"; s.manual=true; } }); // 손으로 감춘 서류 복원 — 새로고침해도 해당없음 유지(파일 있으면 받음이 우선)
  (aj.manualOn||[]).forEach(o=>{ const id=(o&&typeof o==="object")?o.id:o; const s=id&&c.items[id]; if(s && !(s.files&&s.files.length) && !s.done){ s.manual=true; if(s.mode==="na") s.mode=(o&&o.mode)||"request"; } }); // ★손으로 '의뢰인요청/직접발급'으로 켠 서류 복원(manualNa의 반대 짝) — 기본 '해당없음'이라도 상세에서 바꾼 값을 새로고침해도 유지. 파일·받음이 있으면 그쪽이 우선.
  applyTags(c);   // 파일 붙인 뒤 다시 정리 — 파일 있으면 받음, 파일 있는 그룹은 세트로 숨김없이
  /* 의뢰인 메모 / 인증서 붙이기 */
  const _memo=(memos||[]).find(x=>x.kind!=="접수")||null; if(_memo){ c.memo=_memo.body||""; c._sbMemoId=_memo.id; }

  /* ②쓰기 기준선: 지금 서버에 있는 값을 기록(이후 바뀐 것만 저장) */
  Object.keys(c.items).forEach(id=>{ try{ c.items[id]._sbSig=sbItemSig(c,id,c.items[id]); }catch(_){} });
  c._sbSig=sbClientSig(c); c._sbMemo=c.memo||""; c._sbCertSig=JSON.stringify({f:(c.cert&&c.cert.files)||[],p:(c.cert&&c.cert.pw)||""});
  /* ★줄 자가치유 대상 수집: 서버에 '이미 있는' 줄의 기록과 방금 계산된 실제 상태(파일 있으면 받음,
     해당없음 숨김 등 반영 후)가 다르면 담아둔다. 새 줄 생성(insert)은 절대 하지 않는다 —
     무더기 insert 사고(07-03, 4,940줄)의 원천 배제. 실제 처리는 pullFromSupabase 끝에서 순차 실행. */
  c._healRows=[];
  try{
    const _rb={}; (rows||[]).forEach(r=>{ _rb[r.id]=r; });
    Object.keys(c.items).forEach(id=>{
      const s=c.items[id]; if(!s||!s._sbRow) return; const r=_rb[s._sbRow]; if(!r) return;
      const st=sbStatusFwd(s), rr=(s.rejectReason||null);
      if(st!==(r.status||null) || rr!==(r.reject_reason||null)) c._healRows.push({rowId:s._sbRow, status:st, reject_reason:rr, prev:(r.status||null)});
    });
  }catch(_){ c._healRows=[]; }
  return c;
}

/* Supabase에서 전체 읽어와 화면에 표시 (읽기 전용) */
async function pullFromSupabase(silent){
  if(!sbInit()) return false;
  setSync("saving");
  try{
    const BASE_CORE="id,name,office_id,case_type,assignee,stage,phone,income_type,asset_type,court_deadline,deadline_kind,urgent,pinned,archived,amending,correcting,case_no,updated_at,created_at";
    /* 모든 목록은 1,000줄씩 끝까지 이어 받는다(한 번에 받으면 1,000줄에서 잘림) */
    /* rrn_front(주민번호 앞 7자리) 칸이 아직 없는 DB에서도 앱이 죽지 않도록: 포함본 먼저 → 실패하면 빼고 다시 */
    /* on_hold/hold_reason(보류) 칸도 같은 방식으로: 있으면 쓰고, 아직 없으면 빼고 다시 받는다(SQL 실행 전에도 앱이 죽지 않게) */
    let cRes=null;
    outer:
    for(const withBJ of [true,false]){
    for(const withHold of [true,false]){
      for(const withRrn of [true,false]){
        const BASE = BASE_CORE + (withBJ?",intake_type":"") + (withHold?",on_hold,hold_reason":"") + (withRrn?",rrn_front":"");
        cRes=await sbSelectPaged("clients",BASE+",is_public,app_json,collect_pct"); SB_HAS_PCT=!cRes.error;
        if(cRes.error) cRes=await sbSelectPaged("clients",BASE+",is_public,app_json"); // collect_pct 칸 없을 때
        if(cRes.error) cRes=await sbSelectPaged("clients",BASE+",app_json");           // is_public 칸 없을 때
        if(cRes.error) cRes=await sbSelectPaged("clients",BASE);                       // app_json 칸도 없을 때
        SB_HAS_RRN = withRrn && !cRes.error;
        if(!cRes.error){ SB_HAS_HOLD = withHold; SB_HAS_INTAKE = withBJ; break outer; }
      }
    }
    }
    /* ★SB_HAS_PCT 확정: 추측(첫 조회 성공 여부)이 아니라 실제 받은 데이터에 collect_pct 칸이 있는지로 판정.
       일시 오류로 첫 조회만 실패했을 때 취합률 기록이 세션 내내 꺼져 있던 틈을 막는다. */
    if(!cRes.error && cRes.data && cRes.data.length) SB_HAS_PCT = Object.prototype.hasOwnProperty.call(cRes.data[0], "collect_pct");
    /* ★SB_HAS_HOLD도 추측이 아니라 실제 받은 데이터에 on_hold 칸이 있는지로 확정 */
    if(!cRes.error && cRes.data && cRes.data.length) SB_HAS_HOLD = Object.prototype.hasOwnProperty.call(cRes.data[0], "on_hold");
    /* ★SB_HAS_INTAKE도 실제 받은 데이터에 intake_type 칸이 있는지로 확정 */
    if(!cRes.error && cRes.data && cRes.data.length) SB_HAS_INTAKE = Object.prototype.hasOwnProperty.call(cRes.data[0], "intake_type");
    if(cRes.data) cRes.data.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ko"));
    const [ciRes, dRes, mRes, sRes, oRes, pRes] = await Promise.all([
      sbSelectPaged("checklist_items","id,client_id,doc_key,doc_name,bundle,status,reject_reason,memo"),
      sbSelectDocuments(),
      sbSelectPaged("memos","id,client_id,body,created_at,kind"),
      sbSelectPaged("secrets","id,client_id,cert_files,password"),
      sb.from("offices").select("id,name"),
      sb.rpc("my_progress")
    ]);
    if(mRes&&mRes.data) mRes.data.sort((a,b)=>String(a.created_at||"").localeCompare(String(b.created_at||"")));
    if(cRes.error) throw cRes.error;
    if(ciRes.error) throw ciRes.error;
    SB_OFFICES=(oRes&&oRes.data)||[];   // 사무소(이준/블루) 매핑용
    const byClient={}; (ciRes.data||[]).forEach(r=>{ (byClient[r.client_id]=byClient[r.client_id]||[]).push(r); });
    const docBy={}; ((dRes&&dRes.data)||[]).forEach(d=>{ (docBy[d.client_id]=docBy[d.client_id]||[]).push(d); });
    const memoBy={}; ((mRes&&mRes.data)||[]).forEach(m=>{ (memoBy[m.client_id]=memoBy[m.client_id]||[]).push(m); });
    const secBy={}; ((sRes&&sRes.data)||[]).forEach(s=>{ secBy[s.client_id]=s; });
    const clients=(cRes.data||[]).map(row=> sbBuildClient(row, byClient[row.id]||[], docBy[row.id]||[], memoBy[row.id]||[], secBy[row.id]||null) );
    state={ clients, log:(state&&state.log)||[], updatedAt: now(), updatedBy: deviceName||"미설정", _ver:8 };
    saveLocal();
    try{ const _rr=await sb.rpc("my_role"); MYROLE=_rr.data||null; }catch(_){ }
    try{ const _cn=await sb.from("cancel_notes").select("*").order("sort_order",{ascending:true}); if(!_cn.error) CANCEL_NOTES=_cn.data||[]; }catch(_){ }
    currentClientId=null; renderDashboard();
    setSync("ok");
    if(!silent) toast("케이스허브에서 불러왔습니다 ✓");
    /* 검증용 콘솔 로그: 화면 완료율 vs 서버(my_progress) 비교 */
    try{ const pg={}; (pRes&&pRes.data||[]).forEach(p=>pg[p.client_id]=p);
      console.log("[읽기검증] 의뢰인 "+clients.length+"명");
      clients.forEach(c=>{ const mine=progress(c), srv=pg[c._sbId]||{};
        console.log("  "+c.name+" | 화면 "+mine.done+"/"+mine.total+"("+mine.pct+"%)  서버 "+(srv.done)+"/"+(srv.total)+"("+srv.pct+"%)"); });
    }catch(_){}
    /* ★취합률 자가치유: 서버에 적힌 collect_pct(케이스허브가 보여주는 값)가 방금 계산한 화면 값과
       다르면 그 칸 하나만 바로잡는다. 왜: 저장이 한 번 누락되면(튕김·통신오류) 옛 값이 얼어붙는데,
       앱은 켤 때 기준선을 "이미 저장됨"으로 잡아 다시는 안 고쳤다(07-16 전 의뢰인 18명 불일치 사건).
       이제 앱을 켤 때마다 어긋난 사람만 자동으로 맞춘다. 한 명씩 순차 처리(동시 요청 금지 원칙),
       실패해도 조용히 넘어가며 다음 실행 때 다시 시도된다. 화면 표시를 막지 않도록 배경에서 돈다. */
    (async()=>{
      let fixed=0, rowsFixed=0;
      for(const c of clients){
        if(!isUuid(c.id)) continue;
        /* ①취합률(collect_pct) 한 칸 */
        if(SB_HAS_PCT && !isBJOnly(c)){   /* 보정만 사건은 취합률 자가치유 대상에서 뺀다 (2026-08-11) */
          try{
            const want=progress(c).pct;
            if(c._srvPct!==want){
              const r=await sb.from("clients").update({collect_pct:want}).eq("id",c.id).select("id");
              if(!r.error && r.data && r.data.length){ c._srvPct=want; fixed++; }
            }
          }catch(_){}
        }
        /* ②체크리스트 줄 — 서버에 이미 있는 줄만 UPDATE. 안전핀: .eq("status",읽은값) 조건을 걸어
           읽은 뒤 그 사이 다른 기기가 그 줄을 고쳤으면 건드리지 않는다(0줄 갱신으로 조용히 통과,
           다음 켤 때 다시 판단). 새 줄 insert 없음, 삭제 없음. */
        for(const h of (c._healRows||[])){
          try{
            let q=sb.from("checklist_items").update({status:h.status, reject_reason:h.reject_reason}).eq("id",h.rowId);
            q=(h.prev===null)? q.is("status",null) : q.eq("status",h.prev);
            const r=await q.select("id");
            if(!r.error && r.data && r.data.length) rowsFixed++;
          }catch(_){}
        }
        c._healRows=null;
      }
      if(fixed) console.log("[취합률 자가치유] "+fixed+"명 서버값을 화면 값으로 맞춤");
      if(rowsFixed) console.log("[서류줄 자가치유] "+rowsFixed+"줄 서버 기록을 화면 상태로 맞춤");
    })();
    return true;
  }catch(e){ console.error(e); setSync("error"); showBanner("케이스허브 읽기 오류: "+(e.message||e),"err"); return false; }
}

/* 직원 로그인 화면(최소) — 한 번 로그인하면 이 기기는 자동 유지 */
function showLoginGate(msg){
  let el=document.getElementById("sbLoginGate");

    el=document.createElement("div"); el.id="sbLoginGate";
    el.style.cssText="position:fixed;inset:0;z-index:99999;background:#FAF9F7;display:flex;align-items:center;justify-content:center;padding:20px";
    el.innerHTML='<div style="width:100%;max-width:340px;background:#fff;border:1px solid #E7E2DC;border-radius:16px;padding:26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)">'
      +'<div style="font-weight:800;font-size:18px;color:#9B1B33;margin-bottom:4px">법무법인 이준 서초 분사무소 · 서류취합</div>'
      +'<div style="font-size:13px;color:#6B655F;margin-bottom:18px">직원 로그인 (한 번만 하면 이 기기는 자동 유지됩니다)</div>'
      +'<input id="sbEmail" type="email" placeholder="이메일" autocomplete="username" style="width:100%;padding:11px 12px;border:1px solid #E7E2DC;border-radius:10px;font-size:15px;margin-bottom:10px">'
      +'<input id="sbPw" type="password" placeholder="비밀번호" autocomplete="current-password" style="width:100%;padding:11px 12px;border:1px solid #E7E2DC;border-radius:10px;font-size:15px;margin-bottom:14px">'
      +'<button id="sbLoginBtn" onclick="sbLogin()" style="width:100%;padding:12px;border:0;border-radius:10px;background:#9B1B33;color:#fff;font-weight:800;font-size:15px;cursor:pointer">들어가기</button>'
      +'<div id="sbLoginMsg" style="font-size:12.5px;color:#9A5A00;margin-top:10px;min-height:16px"></div></div>';
    document.body.appendChild(el);
    const pw=el.querySelector("#sbPw"); if(pw) pw.addEventListener("keydown",e=>{ if(e.key==="Enter") sbLogin(); });
  }
  el.style.display="flex";
  const m=document.getElementById("sbLoginMsg"); if(m) m.textContent=msg||"";
}
function hideLoginGate(){ const el=document.getElementById("sbLoginGate"); if(el) el.style.display="none"; }
async function sbLogin(){
  if(!sbInit()){ showLoginGate("로그인 모듈 로딩 실패 — 새로고침 해주세요"); return; }
  const email=(document.getElementById("sbEmail").value||"").trim();
  const pw=document.getElementById("sbPw").value||"";
  if(!email||!pw){ showLoginGate("이메일과 비밀번호를 입력하세요"); return; }
  showLoginGate("로그인 중…");
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){ showLoginGate("로그인 실패: 이메일/비밀번호를 확인하세요"); return; }
    sbUser=data.user; hideLoginGate(); sbWho(); await pullFromSupabase(false);
  }catch(e){ showLoginGate("로그인 오류: "+(e.message||e)); }
}
function sbWho(){ const w=document.getElementById("sbWho"), b=document.getElementById("logoutBtn");
  if(sbUser){ if(w) w.textContent=sbUser.email||""; if(b) b.style.display=""; }
  else { if(w) w.textContent=""; if(b) b.style.display="none"; } }
async function sbLogout(){ if(!confirm("로그아웃할까요? 다시 들어오려면 이메일·비밀번호가 필요합니다.")) return; try{ if(sbInit()) await sb.auth.signOut(); }catch(_){} sbUser=null; sbWho(); showLoginGate("로그아웃됨"); }

/* ============================================================
   ★ ②쓰기: 변경된 의뢰인만 골라 케이스허브(Supabase)에 저장
   - 모든 변경은 scheduleSync() 한 길목을 지나므로 거기서 호출.
   - 화면 항목 상태 → 케이스허브 status 로 변환해 저장(+doc_key 채움).
   ============================================================ */
const OURS_OFFICE_ID="689027dc-305f-43ba-9870-e3978f6e8b01"; // 우리(이준 서초) 사무소 id
const SB_STAGE_FWD={"상담":"서류취합중","서류수집":"서류취합중","검토":"취합완료","서류작성":"취합완료","법원접수":"접수완료","개시결정":"개시결정","인가결정":"인가결정","기각":"기각","완료":"인가결정"};
/* ★'서류작성'은 취합앱에만 있는 단계다. 케이스허브(clients.stage)에는 '취합완료'로 적는다.
   그러면 다시 읽을 때 '검토'로 되돌아가 버리므로, 취합앱 자기 단계는 app_json.stage2 에 따로 적어 둔다.
   케이스허브에서 단계를 바꾸면 stage2와 어긋나므로 그때는 케이스허브 값을 따른다(아래 sbRowToClient). */
const BID_BUNDLE={b1:"기본서류",b2:"채권자목록",b3:"재산",b4:"수입지출",b5:"기타",b6:"통장거래내역",b7:"경위서"};
const ITEM_BLOCK={}; TEMPLATE.forEach(b=>b.groups.forEach(g=>g.items.forEach(it=>{ ITEM_BLOCK[it.id]=b.id; })));
function isUuid(v){ return typeof v==="string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v); }
/* 화면 항목 상태 → 케이스허브 status (데이터매핑 3번 규칙) */
function sbStatusFwd(s){ if(!s) return "미요청"; if(s.mode==="na") return "해당없음"; if(s.rejected) return "보완필요"; if(s.done) return "받음"; if(s.mode==="request"&&s.reqTag==="requesting") return "요청중"; return "미요청"; }
function sbItemMeta(c,id){
  if(ITEM_BY_ID[id]) return { bundle: BID_BUNDLE[ITEM_BLOCK[id]]||"기타", name: ITEM_BY_ID[id].name };
  let found=null; Object.keys(c.extra||{}).forEach(bid=>{ (c.extra[bid]||[]).forEach(x=>{ if(x.id===id) found={ bundle:BID_BUNDLE[bid]||"기타", name:x.name||"서류" }; }); });
  return found;
}
function sbItemSig(c,id,s){ const m=sbItemMeta(c,id)||{}; return sbStatusFwd(s)+"|"+(s.rejectReason||"")+"|"+(s.memo||"")+"|"+(m.bundle||"")+"|"+(m.name||""); }
/* 사무소(이준/블루) ↔ office_id 매핑 (SB_OFFICES는 pull에서 채움) */
let SB_OFFICES=[];
function sbFirmFromOffice(oid){ const o=SB_OFFICES.find(x=>x.id===oid); if(!o) return null; const n=o.name||""; if(n.includes("블루")) return "법률사무소 블루"; if(n.includes("이준")) return "법무법인 이준 서초 분사무소"; return n; }
function sbOfficeFromFirm(firm){ const blue=(firm||"").includes("블루"); const o=SB_OFFICES.find(x=> blue ? (x.name||"").includes("블루") : (x.name||"").includes("이준")); return o? o.id : OURS_OFFICE_ID; }
/* 화면 전용 항목(케이스허브 칸 없음)을 보존: 사무소·주거유형·보낸메시지·상담기록 */
function sbAppJson(c){ return { stage2: clientStage(c), firm:c.firm||null, onHold:!!c.onHold, holdReason:c.holdReason||"", housing:c.housing||"미정", pensionKind:c.pensionKind||null, dualParts:(Array.isArray(c.dualParts)?c.dualParts:[]), msgLog:Array.isArray(c.msgLog)?c.msgLog:[], timeline:Array.isArray(c.timeline)?c.timeline:[], manualNa: Object.keys(c.items||{}).filter(id=>{ const s=c.items[id]; return s && s.manual && s.mode==="na"; }), manualOn: NA_DEFAULT.filter(id=>{ const s=c.items[id]; return s && s.manual && s.mode!=="na"; }).map(id=>({ id, mode:c.items[id].mode })), msgTpl:(c.msgTpl&&typeof c.msgTpl==="object")?c.msgTpl:{} }; }
function sbClientPayload(c){ const __p={ name:c.name||"이름없음", case_type:c.caseType||"개인회생", assignee:c.assignee||null,
  stage: SB_STAGE_FWD[clientStage(c)]||"서류취합중", phone:c.phone||null, income_type:c.incomeType||null,
  asset_type:(c.assets&&c.assets.length)?c.assets.join(","):null, court_deadline:c.deadline||null, deadline_kind:c.deadlineLabel||null,
  urgent:!!c.urgent, pinned:!!c.pinned, archived:!!c.archived, amending:!!c.amending, case_no:c.caseNo||null,
  is_public:!!c.isPublic, app_json: sbAppJson(c) };
  /* ★보정만 사건은 취합률을 서버에 적지 않는다. 적으면 케이스허브에 0%로 전파된다 (2026-08-11) */
  if(SB_HAS_PCT && !isBJOnly(c)){ try{ __p.collect_pct = progress(c).pct; }catch(_){} }
  /* 보류 — 칸이 있으면 칸에도 적는다(케이스허브가 이 칸을 읽는다). 칸이 없으면 app_json에만 남는다. */
  if(SB_HAS_HOLD){ __p.on_hold = !!c.onHold; __p.hold_reason = ((c.holdReason||"").trim()||null); }
  /* 접수 형태 — 칸이 있을 때만 적는다(없으면 이 기능만 조용히 꺼진다) */
  if(SB_HAS_INTAKE){ __p.intake_type = (c.intakeType==='보정만') ? '보정만' : '전체'; }
  /* ★★보정만 사건의 진행 단계는 취합앱이 절대 건드리지 않는다 (2026-08-11).
     케이스허브에서 정한 보정중·개시결정·인가결정·기각은 취합앱 단계 목록에 없어서,
     그대로 두면 저장할 때마다 "서류취합중"으로 되돌아가 버린다. 그래서 stage를 통째로 뺀다. */
  if(isBJOnly(c)) delete __p.stage;
  /* ★주민번호는 이 페이로드에 넣지 않는다. 앱이 직접 clients에 쓰지 않고 서버 함수(rrn_set)로만 저장한다.
     (전체 번호는 암호화 표 client_rrn에, 앞 7자리는 서버가 clients.rrn_front에 적는다) */
  /* ★사무소 동기화(2026-07-20): firm(블루/이준 토글)이 정해져 있으면 office_id도 그 사무소로 맞춰 저장한다.
     예전엔 office_id를 '수정 시 제외'해, 토글만 블루로 바꿔도 office_id는 이준에 남는 어긋남이 생겼다(최혁진 사건 — 케이스허브·원사무실에서 안 보임).
     단, SB_OFFICES에서 실제 매칭 사무소를 찾았을 때만 동기화한다(로딩 전 등 못 찾으면 기존 office_id 보존 → 잘못 덮어씀 방지). */
  if(c.firm){ const _blue=c.firm.indexOf("블루")>=0, _jun=c.firm.indexOf("이준")>=0;
    if(_blue||_jun){ const _o=(SB_OFFICES||[]).find(x=> _blue ? String(x.name||"").indexOf("블루")>=0 : String(x.name||"").indexOf("이준")>=0);
      if(_o && _o.id) __p.office_id=_o.id; } }
  return __p; }
/* office_id 동기화는 위 sbClientPayload에서 firm 기준으로 처리(수정·생성 공통). 신규 생성 경로에서도 아래에서 한 번 더 보정한다. */
function sbClientSig(c){ return JSON.stringify(sbClientPayload(c)); }

/* ★서류 칸(checklist_items) 저장 — "없으면 만들고, 있으면 고쳐 쓴다"
   왜: 예전에는 앱이 읽어온 데이터만 보고 "서버에 줄이 없다"고 판단해 무조건 새로 만들었다.
       그 판단이 틀리면(1,000줄 한계로 못 읽었거나, 다른 기기가 먼저 만들었거나) 중복 줄이 생겼다.
       실제로 그렇게 4,940줄이 쌓였다(2026-07-13 정리 완료).
   이제: 만들기 전에 서버에 같은 줄이 있는지 확인하고, 있으면 그 줄을 고쳐 쓴다.
        동시에 두 기기가 만들어 충돌(23505)이 나도 그 줄을 찾아 고쳐 쓴다. */
async function sbUpsertItem(c, s, meta, status, isig, dkey){
  const payload={ status, reject_reason:s.rejectReason||null, memo:s.memo||null, doc_key:dkey, bundle:meta.bundle, doc_name:meta.name };
  if(dkey){                       // 표준 서류 칸: 먼저 서버에 있는지 확인
    const f=await sb.from("checklist_items").select("id").eq("client_id",c.id).eq("doc_key",dkey).limit(1);
    if(f.error) throw f.error;
    const row=(f.data&&f.data[0])||null;
    if(row){ const u=await sb.from("checklist_items").update(payload).eq("id",row.id); if(u.error) throw u.error;
             s._sbRow=row.id; s._sbSig=isig; return; }
  }
  const r=await sb.from("checklist_items").insert(Object.assign({client_id:c.id}, payload)).select("id").single();
  if(r.error){
    if(dkey && String(r.error.code)==="23505"){   // 자물쇠 충돌 = 그 찰나에 다른 기기가 만듦 → 그 줄을 찾아 고쳐 쓴다
      const f2=await sb.from("checklist_items").select("id").eq("client_id",c.id).eq("doc_key",dkey).limit(1);
      const row2=(f2.data&&f2.data[0])||null;
      if(row2){ const u2=await sb.from("checklist_items").update(payload).eq("id",row2.id); if(u2.error) throw u2.error;
                s._sbRow=row2.id; s._sbSig=isig; return; }
    }
    throw r.error;
  }
  s._sbRow=r.data.id; s._sbSig=isig;
}
async function sbSyncClient(c){
  const sig=sbClientSig(c);
  const payload=sbClientPayload(c); payload.updated_at=new Date().toISOString();
  if(!isUuid(c.id)){                       // 앱에서 새로 만든 의뢰인 → insert
    payload.office_id = sbOfficeFromFirm(c.firm) || OURS_OFFICE_ID;   // 신규 생성 때만 사무소 지정(수정 시엔 보존)
    const {data,error}=await sb.from("clients").insert(payload).select("id").single();
    if(error) throw error;
    const oldId=c.id; c.id=data.id; if(currentClientId===oldId) currentClientId=c.id;
    c._sbSig=null;                         // 새 의뢰인은 항목 전부 insert
  } else if(c._sbSig!==sig){               // 기존 의뢰인 정보 변경 → update
    const {data:_ud,error}=await sb.from("clients").update(payload).eq("id",c.id).select("id");
    if(error) throw error;
    if(!_ud || _ud.length===0) throw new Error("저장 권한이 없어 서버에 반영되지 않았습니다. 계정 권한을 확인하세요.");
  }
  /* ★주민등록번호 — 서버 함수(rrn_set)로만 저장한다.
     서버가 권한을 확인하고, 전체 13자리는 암호화해 client_rrn에, 앞 7자리는 clients.rrn_front에 넣는다.
     의뢰인이 방금 만들어진 경우에도 위에서 uuid를 받은 뒤라 안전하다. */
  if(c._rrnPending && isUuid(c.id)){
    const {error:_re}=await sb.rpc("rrn_set",{p_cid:c.id, p_rrn:c._rrnPending});
    if(_re) throw new Error("주민등록번호 저장 실패: "+(_re.message||_re));
    c.rrnFront = c._rrnPending.slice(0,6)+"-"+c._rrnPending.slice(6,7);
    delete c._rrnPending;
    if(currentClientId===c.id) renderDetail(c.id);
  }
  // 체크리스트: 바뀐 줄만
  const jobs=[];
  Object.keys(c.items).forEach(id=>{
    const s=c.items[id]; const meta=sbItemMeta(c,id); if(!meta) return;
    const status=sbStatusFwd(s); const isig=sbItemSig(c,id,s); const dkey=ITEM_BY_ID[id]?id:(s.doc_key||null);
    if(s._sbRow){
      if(s._sbSig!==isig){ jobs.push(sb.from("checklist_items").update({status,reject_reason:s.rejectReason||null,memo:s.memo||null,doc_key:dkey,bundle:meta.bundle,doc_name:meta.name}).eq("id",s._sbRow).then(r=>{ if(r.error) throw r.error; s._sbSig=isig; })); }
    } else if(s._sbSig!==isig){   // ★ 서버에 줄이 없어 보이는 항목은 '직원이 실제로 건드린 것만' 처리(안 건드린 항목을 무더기로 만들어 진행률을 흔들지 않기 위함).
      jobs.push(sbUpsertItem(c, s, meta, status, isig, dkey));   // ★있으면 고쳐 쓰기 — 중복 줄이 생기지 않는다
    }
  });
  /* ★체크리스트 저장이 실패해도 아래 첨부파일 장부 기록은 반드시 시도한다.
     (예전에는 여기서 예외가 나면 documents insert가 통째로 건너뛰어져 파일 기록이 사라졌다.) */
  let _syncErr=null;
  if(jobs.length){ try{ await Promise.all(jobs); }catch(e){ _syncErr=_syncErr||e; } }
  // 첨부파일 메타(documents): 아직 기록 안 된 새 파일만 insert (즉시 기록이 실패했거나 옛 데이터인 경우의 안전망)
  const docJobs=[];
  Object.keys(c.items).forEach(id=>{
    const s=c.items[id]; if(!s.files||!s.files.length) return;
    const dkey=ITEM_BY_ID[id]?id:(s.doc_key||id);
    s.files.forEach((f,fidx)=>{ if(f.driveId && !f.docId){ const _doc={client_id:c.id,doc_key:dkey,file_name:f.name,storage_path:f.driveId,uploaded_by:f.by||deviceName||"직원",is_public:!!f.is_public,kind:"취합"}; if(SB_HAS_SORT) _doc.sort_order=fidx; docJobs.push(sb.from("documents").insert(_doc).select("id").single().then(r=>{ if(r.error) throw r.error; f.docId=r.data.id; })); } });
  });
  if(docJobs.length){ try{ await Promise.all(docJobs); }catch(e){ _syncErr=_syncErr||e; } }
  // 의뢰인 메모(한 줄로 유지)
  if((c.memo||"")!==(c._sbMemo||"")){
    if(c._sbMemoId){ const {error}=await sb.from("memos").update({body:c.memo||""}).eq("id",c._sbMemoId); if(error) throw error; }
    else if(c.memo){ const {data,error}=await sb.from("memos").insert({client_id:c.id,body:c.memo,author:deviceName||"직원",is_public:false,kind:"취합"}).select("id").single(); if(error) throw error; c._sbMemoId=data.id; }
    c._sbMemo=c.memo||"";
  }
  // 인증서·비번(고보안)
  const certSig=JSON.stringify({f:(c.cert&&c.cert.files)||[],p:(c.cert&&c.cert.pw)||""});
  if(certSig!==(c._sbCertSig||JSON.stringify({f:[],p:""}))){
    const hasCert=c.cert&&((c.cert.pw)||(c.cert.files&&c.cert.files.length));
    if(c._sbSecretId){ const {error}=await sb.from("secrets").update({cert_files:(c.cert&&c.cert.files)||[],password:(c.cert&&c.cert.pw)||null}).eq("id",c._sbSecretId); if(error) throw error; }
    else if(hasCert){ const {data,error}=await sb.from("secrets").insert({client_id:c.id,cert_files:(c.cert.files)||[],password:c.cert.pw||null,staff_only:true}).select("id").single(); if(error) throw error; c._sbSecretId=data.id; }
    c._sbCertSig=certSig;
  }
  if(_syncErr) throw _syncErr;      // 저장 못 한 게 있으면 '저장됨' 표시를 남기지 않는다(다음 저장 때 다시 시도)
  c._sbSig=sbClientSig(c);
}

async function pushToSupabase(silent){
  if(!sbInit()||!sbUser) return false;
  setSync("saving");
  try{
    // 쓰기 권한 확인 — 권한없는 계정(office 등)의 '조용한 저장 실패' 방지
    try{ const _rr=await sb.rpc("my_role"); const _role=_rr.data;
      if(_role!=="master" && _role!=="staff"){ setSync("error"); showBanner("⚠️ 이 계정은 저장 권한이 없습니다(현재 권한: "+(_role||"없음")+"). 입력이 서버에 저장되지 않습니다. 관리자에게 권한(staff/master) 변경을 요청하세요.","err"); return false; } }catch(_e){}
    const delUuids=(state.deleted||[]).filter(isUuid);
    if(delUuids.length){ try{ await sb.from("clients").delete().in("id",delUuids); }catch(_){} }
    /* ★한 의뢰인에서 오류가 나도 나머지는 계속 저장한다.
       (예전에는 for 루프가 통째로 중단돼, 뒤에 있는 의뢰인의 저장이 시도조차 되지 않았다.) */
    const failed=[];
    for(const c of (state.clients||[])){
      try{ await sbSyncClient(c); }
      catch(e){ console.error("저장 실패:", c&&c.name, e);
        failed.push((c&&c.name||"이름없음")+" — "+(e.message||e));
        dlog("fail","케이스허브 저장",{client_name:(c&&c.name)||"", detail:String(e.message||e).slice(0,300)}); }
    }
    if(failed.length){
      setSync("error");
      showBanner("⚠️ 저장 실패 "+failed.length+"건 — "+esc(failed.slice(0,2).join(" / "))+(failed.length>2?" 외":"")+". 새로고침하면 저장 안 된 내용이 사라집니다. 캡처해서 알려주세요.","err");
      dlogFlush();
      return false;
    }
    setSync("ok");
    if(!silent) toast("케이스허브에 저장됨 ✓");
    return true;
  }catch(e){ console.error(e); setSync("error"); showBanner("케이스허브 저장 오류: "+(e.message||e),"err"); return false; }
}

function boot(){
  let loaded=false;
  try{ const d=localStorage.getItem(LS_DATA); if(d){ state=JSON.parse(d); loaded=true; } }catch(_){}
  if(!loaded){ // 1차 복구: 직전본
    try{ const b=localStorage.getItem(LS_DATA_BAK); if(b){ state=JSON.parse(b); loaded=true; toast("직전 저장본에서 복구했습니다"); } }catch(_){}
  }
  if(!loaded){ // 2차 복구: 최신 스냅샷
    try{ const snaps=getSnapshots(); if(snaps.length){ state=JSON.parse(snaps[0].data); loaded=true; toast("자동 스냅샷에서 복구했습니다"); } }catch(_){}
  }
  try{ const c=localStorage.getItem(LS_CFG); if(c) cfg=Object.assign(cfg,JSON.parse(c)); }catch(_){}
  if(!state.clients) state.clients=[]; if(!state.log) state.log=[];
  try{ _trimStorage(SNAP_MAX); }catch(_){}   // 시작 시 오래된 자동백업 정리(용량 확보)
  state.clients.forEach(ensureItems);
  if(migrateIfNeeded()) saveLocal();
  updateSyncPill();
  renderDashboard();
  if(location.protocol==="file:"){ showBanner("⚠️ <b>이 파일이 아니라 인터넷 링크(github.io 주소)로 여세요.</b> 파일로 열면 다른 기기와 동기화·자동연결이 되지 않고, 입력이 이 컴퓨터에만 남습니다.","warn"); }
  if(BACKEND==="supabase"){
    if(sbInit()){
      sb.auth.getSession().then(({data})=>{
        if(data && data.session){ sbUser=data.session.user; sbWho(); pullFromSupabase(true); }
        else { showLoginGate(""); }
      }).catch(()=>showLoginGate(""));
    } else { showLoginGate("로그인 모듈 로딩 실패 — 새로고침 해주세요"); }
  } else if(githubReady()){ pullFromGithub(true).then(()=>startPolling()); }
}
window.addEventListener("DOMContentLoaded",boot);
window.addEventListener("beforeunload",()=>{ saveLocal(); });
</script>
